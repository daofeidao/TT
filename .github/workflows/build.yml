name: TT 编译与发布

on:
  push:
    branches: [main, "v*"]
  workflow_dispatch:

concurrency:
  group: tt-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  # 单一版本来源：IPA 文件名、tag、产物名、Info.plist 校验全部引用这里。
  # 升版本只改这一行；分支用 v* 通配，不必再往 branches 里补版本号。
  VERSION: "0.4.11"

jobs:
  build:
    name: 编译 iOS 安装包
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: 获取项目源码
        uses: actions/checkout@v4

      - name: 检查苹果编译环境
        run: |
          xcode-select -p
          xcodebuild -version

      - name: 安装项目生成工具
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          fi
          xcodegen --version

      - name: 生成 TT 应用图标
        run: swift scripts/generate_icon.swift

      - name: 编译容器内探针程序 ttprobe
        run: |
          set -euo pipefail
          SYSROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun -sdk iphoneos clang -arch arm64 -isysroot "$SYSROOT" -O2 -o scripts/ttprobe scripts/ttprobe.c
          file scripts/ttprobe
          test -s scripts/ttprobe

      - name: 构建内置命令工具 ttbin
        run: |
          set -euo pipefail
          SYSROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          mkdir -p TT/ttbin
          for t in ls cat date whoami uname df wc head tail grep \
                   touch mkdir rm cp mv sort uniq cut tr du stat find; do
            xcrun -sdk iphoneos clang -arch arm64 -isysroot "$SYSROOT" -O2 -o "TT/ttbin/$t" "scripts/tttools/tt${t}.c"
          done
          xcrun -sdk iphoneos clang -arch arm64 -isysroot "$SYSROOT" -O2 -o TT/ttbin/ttfork scripts/tttools/ttfork.c
          file TT/ttbin/*

      - name: 构建内置 Shell mksh 并签名嵌套二进制
        run: bash scripts/build-mksh.sh

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 编译 iPhone 应用
        run: |
          set -euo pipefail
          xcodebuild \
            -project TT.xcodeproj \
            -scheme TT \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: 打包 IPA 安装包
        run: |
          set -euo pipefail
          APP="build/DerivedData/Build/Products/Release-iphoneos/TT.app"
          test -d "$APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist" | grep -Fx 'com.daofeidao.tt'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist" | grep -Fx "$VERSION"
          test -s "$APP/ttprobe"
          test -s "$APP/ttbin/mksh"
          for t in ls cat date whoami uname df wc head tail grep ttfork; do test -s "$APP/ttbin/$t"; done
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/TT.app
          /usr/bin/codesign --force --deep --sign - --entitlements tt.entitlements build/ipa/Payload/TT.app
          cd build/ipa
          /usr/bin/zip -qry "../TT-v$VERSION.ipa" Payload
          cd ../..
          test -s "build/TT-v$VERSION.ipa"
          echo "IPA 安装包已生成："
          ls -lh "build/TT-v$VERSION.ipa"
          /usr/bin/unzip -l "build/TT-v$VERSION.ipa" | head -40

      - name: 发布并上传 IPA
        if: github.ref == 'refs/heads/v0.4.11-autocomplete-options' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: TT v${{ env.VERSION }}（补全选项 + 横杠按需补）
          body: |
            ## v0.4.11：补全支持「`-` 之后补选项」，横杠按需补

            基线 **v0.4.10**，本版**只改补全这一处**。

            ### 问题

            补命令名本身价值有限——`sort` 不带参数只能按字符串排，`ls` 不带 `-l`
            什么都看不出来。真正卡人的是"这条命令有哪些选项"。

            ### 改什么

            点一下命令名，**如果该命令确实声明了选项**，补成 `命令名 + 空格 + -`，
            紧接着自动列出它的选项：

            ```
            点 ls    → ls -      候选：-l   -a
            点 sort  → sort -    候选：-n   -r   -u
            点 wc    → wc -      候选：-l   -w   -c
            点 -n    → sort -n
            ```

            **横杠只在该有的时候补。** 手册里有 14 条命令根本没有选项
            （`cat` `mv` `pwd` `date` `whoami` `echo` `sleep` `clear`
            `touch` `stat` `true` `false` `test` `ttfork` `ttprobe`），
            点它们会**干净停在命令名**，不会留个孤零零的横杠让用户去删。

            | 点 | 得到 | 随后候选 |
            |---|---|---|
            | `ls` | `ls -` | `-l` `-a` |
            | `sort` | `sort -` | `-n` `-r` `-u` |
            | `cut` | `cut -` | `-d` `-f` `-c` |
            | `cat` | `cat` | 无 |
            | `mv` | `mv` | 无 |

            ### 顺带简化

            这个交互**取代**了原来的"再点一次给完整模板"规则，少一条记忆负担：

            ```
            旧：点一次 → cat      再点一次 → sort -n -r -u
            新：点一次 → sort -   自动列选项，点 -n → sort -n
            ```

            另外补到正好等于已输入内容的选项时，会自动补一个空格，
            方便接着写参数或路径。

            ### 边界

            - 只在**第二段**以 `-` 开头时补选项；写到第三个词（参数、路径）不再出现
            - 补全的匹配规则（前缀优先 + 包含兜底、最多 12 条）不变

            ### 没动的部分（v0.4.10 原样）

            - 补全填入的内容不再带方括号、不带路径占位
            - 自检一次性输出、无瀑布流
            - 自检配色分层
            - 危险命令拦截（仍是**输密码放行**版）
            - 命令清单的分类筛选 / 编辑 / 自定义
            - 彩色显示、长按选择、复制、输入历史
            - 23 个内置命令 + mksh

            ### 验收

            ```
            1. 输入 so → 出现 sort，点一下 → 应变成 "sort -"，并列出 -n -r -u
            2. 点 -n → 应变成 "sort -n"
            3. 输入 ls → 点一下 → "ls -"，列出 -l -a
            4. 输入 cat → 点一下 → 应是 "cat"（没有横杠！）
            5. 输入 mv → 点一下 → 应是 "mv"（没有横杠！）
            6. 输入 "cat " → 候选消失
            7. 补完后手动加参数，例如 sort -n 后接回车 → 应正常执行或报缺文件
            ```

            **验收状态：** 编译 ⏳、IPA ⏳、**真机待复验**。
          files: build/TT-v${{ env.VERSION }}.ipa
          fail_on_unmatched_files: true
          make_latest: true

      - name: 上传备用编译产物
        uses: actions/upload-artifact@v4
        with:
          name: TT-v${{ env.VERSION }}-测试版-IPA
          path: build/TT-v${{ env.VERSION }}.ipa
          if-no-files-found: error
          retention-days: 14
