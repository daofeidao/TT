name: TT 编译与发布

on:
  push:
    branches: [main, "v*"]
  workflow_dispatch:

concurrency:
  group: tt-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  # 单一版本来源：IPA 文件名、tag、产物名、Info.plist 校验全部引用这里。
  # 升版本只改这一行；分支用 v* 通配，不必再往 branches 里补版本号。
  VERSION: "0.4.0"

jobs:
  build:
    name: 编译 iOS 安装包
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: 获取项目源码
        uses: actions/checkout@v4

      - name: 检查苹果编译环境
        run: |
          xcode-select -p
          xcodebuild -version

      - name: 安装项目生成工具
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          fi
          xcodegen --version

      - name: 生成 TT 应用图标
        run: swift scripts/generate_icon.swift

      - name: 编译容器内探针程序 ttprobe
        run: |
          set -euo pipefail
          SYSROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun -sdk iphoneos clang -arch arm64 -isysroot "$SYSROOT" -O2 -o scripts/ttprobe scripts/ttprobe.c
          file scripts/ttprobe
          test -s scripts/ttprobe

      - name: 构建内置命令工具 ttbin
        run: |
          set -euo pipefail
          SYSROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          mkdir -p TT/ttbin
          for t in ls cat date whoami uname df wc head tail grep; do
            xcrun -sdk iphoneos clang -arch arm64 -isysroot "$SYSROOT" -O2 -o "TT/ttbin/$t" "scripts/tttools/tt${t}.c"
          done
          xcrun -sdk iphoneos clang -arch arm64 -isysroot "$SYSROOT" -O2 -o TT/ttbin/ttfork scripts/tttools/ttfork.c
          file TT/ttbin/*

      - name: 构建内置 Shell mksh 并签名嵌套二进制
        run: bash scripts/build-mksh.sh

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 编译 iPhone 应用
        run: |
          set -euo pipefail
          xcodebuild \
            -project TT.xcodeproj \
            -scheme TT \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: 打包 IPA 安装包
        run: |
          set -euo pipefail
          APP="build/DerivedData/Build/Products/Release-iphoneos/TT.app"
          test -d "$APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist" | grep -Fx 'com.daofeidao.tt'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist" | grep -Fx "$VERSION"
          test -s "$APP/ttprobe"
          test -s "$APP/ttbin/mksh"
          for t in ls cat date whoami uname df wc head tail grep ttfork; do test -s "$APP/ttbin/$t"; done
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/TT.app
          /usr/bin/codesign --force --deep --sign - --entitlements tt.entitlements build/ipa/Payload/TT.app
          cd build/ipa
          /usr/bin/zip -qry "../TT-v$VERSION.ipa" Payload
          cd ../..
          test -s "build/TT-v$VERSION.ipa"
          echo "IPA 安装包已生成："
          ls -lh "build/TT-v$VERSION.ipa"
          /usr/bin/unzip -l "build/TT-v$VERSION.ipa" | head -40

      - name: 发布并上传 IPA
        if: github.ref == 'refs/heads/v0.4.0-color' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: TT v${{ env.VERSION }}（统一彩色显示）
          body: |
            ## v0.4.0：统一彩色显示方案

            深色终端主题，按**来源**着色而非按关键词猜测。

            ### 配色

            | 语义 | 颜色 | 说明 |
            |---|---|---|
            | 正文 | 灰白 `#D4D4D4` | 对比度约 13.5:1，长时间阅读不刺眼 |
            | 命令输入 `› xxx` | 亮青 `#5FD7D7` | |
            | TT 状态 `[TT] 执行引擎…` | 灰蓝 `#8A9BA8` | 视觉退后，与程序输出区分 |
            | 成功（退出码 0、已写入） | 柔绿 `#7BC96F` | |
            | 错误（非零退出码、启动失败） | 珊瑚红 `#E06C75` | |
            | 警告（诊断提示） | 琥珀 `#E5C07B` | |
            | 文件路径提示 | 淡蓝 `#9CDCFE` | |
            | 自检与探针 | 暗紫灰 `#7E7AA2` | 可长期忽略的噪声层 |

            ### 实现要点

            - **按来源着色**：TT 自己的每行在产生时就带语义类别，不解析文本。
              所以 `ls /var/log/error/` 的路径、`grep error app.log` 输出里的 "error"
              都仍是普通正文色，不会被误判。
            - **有限 ANSI 支持**：程序输出走 SGR 解析器（30-37 / 90-97 / 0 / 1 / 22 / 39）。
              颜色状态**不跨片段延续**，被截断的转义序列按原文显示且不改状态，
              后续文字不会被"染色污染"。复制时转义符已剥离。
            - **保留文字标识**：每种状态同时带文字前缀（如 `[TT] 退出码：0`），
              去掉颜色也能读懂，满足不同视觉需求。
            - **不损失已有功能**：长按选择、拖动手柄、复制菜单、一键复制全部、
              输入历史、键盘输入、命令执行均保持；重建富文本时会恢复原有选区。

            ### 建议测试

            ```
            ls /nonexistent          → 错误行红，正文灰白
            ls /var/log              → 路径里的 error 不会被染红
            echo -e "\033[31m红\033[0m字"   → 红后恢复灰白
            ls /etc | head -3         → 管道各段颜色正确
            ```

            重点回归：长按选择与复制、📋 一键复制全部、输入历史、连续执行后选区不丢。

            **验收状态：** 编译 ✅、IPA ✅、真机执行 ⏳ 待验证。
          files: build/TT-v${{ env.VERSION }}.ipa
          fail_on_unmatched_files: true
          make_latest: true

      - name: 上传备用编译产物
        uses: actions/upload-artifact@v4
        with:
          name: TT-v${{ env.VERSION }}-测试版-IPA
          path: build/TT-v${{ env.VERSION }}.ipa
          if-no-files-found: error
          retention-days: 14