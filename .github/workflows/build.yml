name: TT 编译与发布

on:
  push:
    branches: [main, "v*"]
  workflow_dispatch:

concurrency:
  group: tt-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  # 单一版本来源：IPA 文件名、tag、产物名、Info.plist 校验全部引用这里。
  # 升版本只改这一行；分支用 v* 通配，不必再往 branches 里补版本号。
  VERSION: "0.4.16"

jobs:
  build:
    name: 编译 iOS 安装包
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: 获取项目源码
        uses: actions/checkout@v4

      - name: 检查苹果编译环境
        run: |
          xcode-select -p
          xcodebuild -version

      - name: 安装项目生成工具
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          fi
          xcodegen --version

      - name: 生成 TT 应用图标
        run: swift scripts/generate_icon.swift

      - name: 编译容器内探针程序 ttprobe
        run: |
          set -euo pipefail
          SYSROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun -sdk iphoneos clang -arch arm64 -isysroot "$SYSROOT" -O2 -o scripts/ttprobe scripts/ttprobe.c
          file scripts/ttprobe
          test -s scripts/ttprobe

      - name: 构建内置命令工具 ttbin
        run: |
          set -euo pipefail
          SYSROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          mkdir -p TT/ttbin
          for t in ls cat date whoami uname df wc head tail grep \
                   touch mkdir rm cp mv sort uniq cut tr du stat find; do
            xcrun -sdk iphoneos clang -arch arm64 -isysroot "$SYSROOT" -O2 -o "TT/ttbin/$t" "scripts/tttools/tt${t}.c"
          done
          xcrun -sdk iphoneos clang -arch arm64 -isysroot "$SYSROOT" -O2 -o TT/ttbin/ttfork scripts/tttools/ttfork.c
          file TT/ttbin/*

      - name: 构建内置 Shell mksh 并签名嵌套二进制
        run: bash scripts/build-mksh.sh

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 编译 iPhone 应用
        run: |
          set -euo pipefail
          xcodebuild \
            -project TT.xcodeproj \
            -scheme TT \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: 打包 IPA 安装包
        run: |
          set -euo pipefail
          APP="build/DerivedData/Build/Products/Release-iphoneos/TT.app"
          test -d "$APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist" | grep -Fx 'com.daofeidao.tt'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist" | grep -Fx "$VERSION"
          test -s "$APP/ttprobe"
          test -s "$APP/ttbin/mksh"
          for t in ls cat date whoami uname df wc head tail grep ttfork; do test -s "$APP/ttbin/$t"; done
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/TT.app
          /usr/bin/codesign --force --deep --sign - --entitlements tt.entitlements build/ipa/Payload/TT.app
          cd build/ipa
          /usr/bin/zip -qry "../TT-v$VERSION.ipa" Payload
          cd ../..
          test -s "build/TT-v$VERSION.ipa"
          echo "IPA 安装包已生成："
          ls -lh "build/TT-v$VERSION.ipa"
          /usr/bin/unzip -l "build/TT-v$VERSION.ipa" | head -40

      - name: 发布并上传 IPA
        if: startsWith(github.ref, 'refs/heads/v') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: TT v${{ env.VERSION }}（危险命令一律硬拦截）
          body: |
            ## v0.4.16：高危命令一律硬拦截（事故修复）

            **背景**：上一版对高危命令是"按权限分级"——非 root 只弹一次警告，
            点「仍然执行」就放行，弹窗里写着"这条命令只能影响本 App 权限范围内的数据"。

            用户照做了 `rm -rf /`。**那条提示的前提是错的**：
            不 root 也写得动 `/var/mobile/Library` 下的系统数据。结果是设置里大片变英文、
            桌面布局重置、Apple Watch 连不上。

            ### 做什么

            - **取消分级**，高危命令一律硬拦截，**弹窗里只剩「知道了」，没有放行按钮**
            - 删掉 `Hit.hardBlock` 字段和「仍然执行」分支，不留复活的口子
            - **匹配前先归一化**：去引号、压多余空白、转小写。`sh -c "rm -rf /"`、
              `rm  -rf  /`、多行脚本里夹一行，现在都逃不掉
            - 补三个**原本就漏掉**的：`rm -rf ${HOME}`、`rm -rf /tmp/*`（旧规则只判裸 `*`，
              判不到路径里的通配符）、带空格的 fork 炸弹
            - 新增 `find -delete` / `find -exec rm` 规则
            - 「关于」页的"高危命令拦截"固定显示"硬拦截 · 无放行入口"，另加"运行身份"一行

            ### 怎么验的

            新增 `scripts/danger_guard_selftest.ps1`——DangerGuard 的 PowerShell 等价移植
            （本机没 Swift 编译器），**65 条用例**：34 条必须拦下、31 条必须放行。
            前者覆盖 `rm -rf /` 的各种写法（换序选项、长选项、大小写、多余空白、
            `sh -c` 套壳、单引号、多行脚本夹一行、`$HOME` / `${HOME}` / `~` / `/*`）、
            绝对路径 rm、通配符、各系统关键目录、格式化与块设备、`find -delete` / `-exec rm`、
            fork 炸弹；后者是**不该误伤**的日常操作（`rm -rf /tmp/ttd`、`cd /etc`、
            `echo hello > /tmp/a.txt`、`find /tmp -name x -type f` 只查不删 等）。
            当前 **65/65 通过**。改规则必须同步改这个脚本。

            ### 自检当场抓出的真 bug

            `normalized()` 会把整条命令转小写，而这两条规则却拿**大写 `R`** 去比：

            ```swift
            compact.contains("chmod-R777/")   // compact 已是 "chmod-r777/"，永不成立
            compact.contains("chown-R")        // 同理
            ```

            结果 `chmod -R 777 /` 和 `chown -R root /` **从来没被拦过**。
            两处改成小写后用例转绿。

            **验收：**

            ```
            1. 输入 "rm -rf /"     → 弹「已拦截，不会执行」，只有「知道了」
            2. 输入 "rm  -rf  /"   → 同样拦截
            3. 输入 "rm -rf /tmp/ttd" → 正常执行，不弹窗
            4. 「关于」页 → 高危命令拦截 = "硬拦截 · 无放行入口"
            ```

            **验收状态：** 编译 ⏳、IPA ⏳、**真机待复验**。

            ## 历史更新（v0.4.13：路径补全）

            基线 **v0.4.12**，本版**只加这一个功能**。

            ### 做什么

            在吃路径的命令后面补全路径，逐层向下：

            ```
            cd          → 候选：..  ~  以及当前目录下的各个子目录（都带 /）
            cd /e       → 候选：/etc/
            cd /var/m   → 候选：/var/mobile/  /var/mmap/
            cat /etc/ho → 候选：/etc/hosts
            ```

            **目录后面自动带 `/`**，补完可以接着往下补。

            | 命令 | 补什么 |
            |---|---|
            | `cd` `mkdir` | 只补**目录**，另加 `..`（上一级）和 `~`（用户主目录） |
            | `ls` `cat` `cp` `mv` `rm` `touch` `stat` `head` `tail` `wc` `grep` `du` | 文件和目录都补 |
            | `sort` `uniq` `cut` `tr` `echo` `pwd` `date` 等 | 不补路径（这些参数不是路径） |

            `~` 取的是 App 的当前目录对应的用户主目录；相对路径按**当前目录**解析，
            所以 `cd bin` 之后直接补 `ls ` 列的就是 `/bin` 的内容。

            细节：与 shell 习惯一致，**没显式打点号时不补隐藏文件**；打了点号才补。

            ### 关键：列目录不在 body 里做

            这是本版最要紧的实现约束。

            `body` 每次重渲染都会重算一遍被访问的属性——如果路径补全写成计算属性，
            就等于**每敲一个键、每重渲染一次都扫一次盘**。前几个版本把 App 卡死
            （瀑布流那次）就是同一个类型的错误：重活放在渲染路径上。

            所以这里的做法是：

            1. 由 `.onChange(of: command)` 触发，**不在 body 里算**
            2. **120ms 防抖**——连着打字时不会每键都算一次
            3. 放到**后台队列**，算完再回主线程写 `@State`
            4. **目录列表按目录缓存**，同一目录只扫一次
            5. 结果回填前先比对 token，**期间输入变了就丢弃过期结果**
            6. 执行完命令（尤其 `cd`）**清缓存**，重新扫

            另外限制单次最多 12 条，`/System` 这种上百条目的目录也不会一次涌出来。

            ### 没动的部分（v0.4.12 原样）

            - 补全的命令名匹配、`-` 之后补选项、横杠按需补
            - ~~危险命令按权限分级~~（v0.4.16 起改为一律硬拦截，不再分级）
            - 自检一次性输出、无瀑布流、自检配色分层
            - 命令清单的分类筛选 / 编辑 / 自定义
            - 彩色显示、长按选择、复制、输入历史
            - 23 个内置命令 + mksh

            ### 验收

            ```
            1. 输入 "cd "     → 应列出当前目录下的子目录，都带 /
            2. 候选里应有 .. 和 ~
            3. 输入 "cd /e"   → 应出现 /etc/
            4. 输入 "cat /etc/ho" → 应出现 /etc/hosts
            5. 补到 /etc/ 后 → 候选应变成 /etc/ 下的内容
            6. 输入 "cd bin" 发送 → 再输入 "ls " → 应列出 /bin 的内容
            7. 输入 "echo "   → 不应出现路径候选（echo 参数不是路径）
            8. 连着快速打字 → 不应卡顿
            ```

            **验收状态：** 编译 ⏳、IPA ⏳、**真机待复验**。
          files: build/TT-v${{ env.VERSION }}.ipa
          fail_on_unmatched_files: true
          make_latest: true

      - name: 上传备用编译产物
        uses: actions/upload-artifact@v4
        with:
          name: TT-v${{ env.VERSION }}-测试版-IPA
          path: build/TT-v${{ env.VERSION }}.ipa
          if-no-files-found: error
          retention-days: 14
