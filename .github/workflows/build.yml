name: TT 编译与发布

on:
  push:
    branches: [main, "v*"]
  workflow_dispatch:

concurrency:
  group: tt-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  # 单一版本来源：IPA 文件名、tag、产物名、Info.plist 校验全部引用这里。
  # 升版本只改这一行；分支用 v* 通配，不必再往 branches 里补版本号。
  VERSION: "0.3.7"

jobs:
  build:
    name: 编译 iOS 安装包
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: 获取项目源码
        uses: actions/checkout@v4

      - name: 检查苹果编译环境
        run: |
          xcode-select -p
          xcodebuild -version

      - name: 安装项目生成工具
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          fi
          xcodegen --version

      - name: 生成 TT 应用图标
        run: swift scripts/generate_icon.swift

      - name: 编译容器内探针程序 ttprobe
        run: |
          set -euo pipefail
          SYSROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun -sdk iphoneos clang -arch arm64 -isysroot "$SYSROOT" -O2 -o scripts/ttprobe scripts/ttprobe.c
          file scripts/ttprobe
          test -s scripts/ttprobe

      - name: 构建内置命令工具 ttbin
        run: |
          set -euo pipefail
          SYSROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          mkdir -p TT/ttbin
          for t in ls cat date whoami uname df wc head tail grep; do
            xcrun -sdk iphoneos clang -arch arm64 -isysroot "$SYSROOT" -O2 -o "TT/ttbin/$t" "scripts/tttools/tt${t}.c"
          done
          xcrun -sdk iphoneos clang -arch arm64 -isysroot "$SYSROOT" -O2 -o TT/ttbin/ttfork scripts/tttools/ttfork.c
          file TT/ttbin/*

      - name: 构建内置 Shell mksh 并签名嵌套二进制
        run: bash scripts/build-mksh.sh

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 编译 iPhone 应用
        run: |
          set -euo pipefail
          xcodebuild \
            -project TT.xcodeproj \
            -scheme TT \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: 打包 IPA 安装包
        run: |
          set -euo pipefail
          APP="build/DerivedData/Build/Products/Release-iphoneos/TT.app"
          test -d "$APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist" | grep -Fx 'com.daofeidao.tt'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist" | grep -Fx "$VERSION"
          test -s "$APP/ttprobe"
          test -s "$APP/ttbin/mksh"
          for t in ls cat date whoami uname df wc head tail grep ttfork; do test -s "$APP/ttbin/$t"; done
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/TT.app
          /usr/bin/codesign --force --deep --sign - --entitlements tt.entitlements build/ipa/Payload/TT.app
          cd build/ipa
          /usr/bin/zip -qry "../TT-v$VERSION.ipa" Payload
          cd ../..
          test -s "build/TT-v$VERSION.ipa"
          echo "IPA 安装包已生成："
          ls -lh "build/TT-v$VERSION.ipa"
          /usr/bin/unzip -l "build/TT-v$VERSION.ipa" | head -40

      - name: 发布并上传 IPA
        if: github.ref == 'refs/heads/v0.3.7-redirect' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: TT v${{ env.VERSION }}（重定向支持 + fork 结论）
          body: |
            ## v0.3.7：重定向支持 + fork() 结论落地

            ### SIGBUS 根因已查明（v0.3.6 探针数据）

            ttfork 三阶段全部 8/8 命中 SIGBUS，**第 1 次迭代即崩溃**：

            - phase1 纯 `fork()+_exit()`：无 exec、无父进程负载，仍全崩 → **不是 exec 的问题**
            - phase2 `fork()+exec`：全崩
            - phase3 父进程带活子进程继续跑：父进程每次都存活，**只有子进程死**

            结论：**本设备上 `fork()` 系统调用不可用**（子进程出生即 SIGBUS），而 `posix_spawn()` 完全正常
            （应用每条命令都在用它，从未失败）。mksh 单条命令能跑，是因为它对 `-c` 的最后一条命令
            直接 `exec` 而不 fork；一旦需要 fork（多命令 / 管道 / 组合）必崩——这也解释了当年
            TrollTerm 的 forkpty 为何始终失败。

            **因此：应用层拆分命令不是权宜之计，而是本设备上唯一可行的架构。** Shell 语义必须住在应用里。

            ### 本版改动

            1. **输出重定向 `>` / `>>`**：按 shell 语义写入真实文件（`>` 截断、`>>` 追加），写入后终端不再重复显示该段输出。
            2. **输入重定向 `<`**：从文件读取作为该段命令的 stdin。
            3. **路径按当前目录解析**：重定向目标使用终端当前工作目录（`cd` 之后依然正确）。
            4. **自检结论反映探针结果**：检测到 fork 不可用时，结论行会明确说明"组合命令由应用层拆分为单条命令执行"。
            5. 引号内的 `>` `<` 不会被误判为重定向（`echo "a>b"` 仍输出 `a>b`）。

            ### 建议测试

            ```
            echo hello > /tmp/t1.txt        → 期望"已写入"，终端不再显示 hello
            cat /tmp/t1.txt                 → hello
            echo world >> /tmp/t1.txt       → 追加
            cat /tmp/t1.txt                 → hello / world 两行
            wc < /tmp/t1.txt                → 输入重定向
            ls /etc | head -3               → 管道
            echo "a>b"                      → 引号内大于号不触发重定向
            ```

            **验收状态：** 编译 ✅、IPA ✅、真机执行 ⏳ 待验证。
          files: build/TT-v${{ env.VERSION }}.ipa
          fail_on_unmatched_files: true
          make_latest: true

      - name: 上传备用编译产物
        uses: actions/upload-artifact@v4
        with:
          name: TT-v${{ env.VERSION }}-测试版-IPA
          path: build/TT-v${{ env.VERSION }}.ipa
          if-no-files-found: error
          retention-days: 14