name: TT 编译与发布

on:
  push:
    branches: [main, "v*"]
  workflow_dispatch:

concurrency:
  group: tt-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  # 单一版本来源：IPA 文件名、tag、产物名、Info.plist 校验全部引用这里。
  # 升版本只改这一行；分支用 v* 通配，不必再往 branches 里补版本号。
  VERSION: "0.5.4"

jobs:
  build:
    name: 编译 iOS 安装包
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: 获取项目源码
        uses: actions/checkout@v4

      - name: 检查苹果编译环境
        run: |
          xcode-select -p
          xcodebuild -version

      - name: 安装项目生成工具
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          fi
          xcodegen --version

      - name: 生成 TT 应用图标
        run: swift scripts/generate_icon.swift

      - name: 编译容器内探针程序 ttprobe
        run: |
          set -euo pipefail
          SYSROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun -sdk iphoneos clang -arch arm64 -isysroot "$SYSROOT" -O2 -o scripts/ttprobe scripts/ttprobe.c
          file scripts/ttprobe
          test -s scripts/ttprobe

      - name: 构建内置命令工具 ttbin
        run: |
          set -euo pipefail
          SYSROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          mkdir -p TT/ttbin
          for t in ls cat date whoami uname df wc head tail grep \
                   touch mkdir rm cp mv sort uniq cut tr du stat find; do
            xcrun -sdk iphoneos clang -arch arm64 -isysroot "$SYSROOT" -O2 -o "TT/ttbin/$t" "scripts/tttools/tt${t}.c"
          done
          xcrun -sdk iphoneos clang -arch arm64 -isysroot "$SYSROOT" -O2 -o TT/ttbin/ttfork scripts/tttools/ttfork.c
          file TT/ttbin/*

      - name: 构建内置 Shell mksh 并签名嵌套二进制
        run: bash scripts/build-mksh.sh

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 编译 iPhone 应用
        run: |
          set -euo pipefail
          xcodebuild \
            -project TT.xcodeproj \
            -scheme TT \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: 打包 IPA 安装包
        run: |
          set -euo pipefail
          APP="build/DerivedData/Build/Products/Release-iphoneos/TT.app"
          test -d "$APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist" | grep -Fx 'com.daofeidao.tt'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist" | grep -Fx "$VERSION"
          test -s "$APP/ttprobe"
          test -s "$APP/ttbin/mksh"
          for t in ls cat date whoami uname df wc head tail grep ttfork; do test -s "$APP/ttbin/$t"; done
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/TT.app
          /usr/bin/codesign --force --deep --sign - --entitlements tt.entitlements build/ipa/Payload/TT.app
          cd build/ipa
          /usr/bin/zip -qry "../TT-v$VERSION.ipa" Payload
          cd ../..
          test -s "build/TT-v$VERSION.ipa"
          echo "IPA 安装包已生成："
          ls -lh "build/TT-v$VERSION.ipa"
          /usr/bin/unzip -l "build/TT-v$VERSION.ipa" | head -40

      - name: 发布并上传 IPA
        if: startsWith(github.ref, 'refs/heads/v') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: TT v${{ env.VERSION }}（撤回 v0.5.3 的附件栏重写，恢复可启动；你要的三点全部保留）
          body: |
            ## v0.5.4：撤回 v0.5.3 的附件栏重写

            ### 先说清楚发生了什么

            v0.5.3 **点图标闪一下就退出**，App 起不来。那一版把附件栏整个重写成了
            纯 UIKit（`UIScrollView` + `UIStackView` + `UIButton` + 一堆 Auto Layout 约束），
            加自定义 `UIView` 子类去钉死高度。

            我排查后**没找到崩溃点**：

            - 包结构、签名、文件数与 0.5.2 **完全一致**，不是打包问题；
            - 那一版启动路径上附件栏那段代码**根本不会执行**（默认收起时不创建视图）；
            - 逐行 diff 过，附件栏之外的改动只有「删了几个没人再调的方法」。

            猜了两轮都没猜中，就**不再猜**：这一版把附件栏**退回 v0.5.2 那套
            已验证能启动的写法**，只保留你要的改动。

            ### 你要的三点，一条没少

            | 你要的 | 状态 |
            |---|---|
            | `^C` 挪到输入框**最右边**，红色 | 保留 |
            | 打开 App **只有输入框和键盘**，没有附件栏 | 保留 |
            | 点最左侧 `›` 才**拉出一行**，含 `↑ ↓` 等 | 保留（一行，不是两行） |

            ```
            打开 App        只有输入框 + 键盘，键盘直接贴着输入框
            点 ›（最左侧）   键盘上方拉出**一行**：↑ ↓ + 全部符号键
            再点 ›          收起，键盘贴回去
            ```

            收起时是**真的 `inputAccessoryView = nil`**——
            挂一个高度 0 的空视图不算没挂，UIKit 照样给它留位置，键盘还是会被顶开一条缝。

            `^C` 为什么挪到输入框：它以前藏在附件栏里，要先展开才看得见，
            可它的使用时机恰恰是**「命令正在跑」**——那会儿人正盯着终端输出，
            不会想到去展开一行按键。现在常驻输入行最右端，跑到一半扫一眼就按得到；
            空闲时置灰。

            ### 撤回了什么

            | 撤回 | 原因 |
            |---|---|
            | `AccessoryBarView` 自定义 `UIView` | `setFrame` 在 Swift 里根本不可 override，CI 第一轮就报过；为了「夹高度」加的那套也得一并撤 |
            | `UIStackView` / `addAction` / `contentLayoutGuide` 那套约束 | 整块随重写一起撤，回到 v0.5.2 的 SwiftUI 写法 |
            | 「内容铺满容器防留缝」 | 一并撤回。这条本来是对的思路，但实现代价太大，先不赌 |

            保留的一处修正：**`.ignoresSafeArea()` 排到 `.frame(height:)` 前面**。
            写反了等于让它去扩张一个定死高度的容器——这条已写进注释。

            ### 已知没修的

            | 问题 | 状态 |
            |---|---|
            | 冷启动第一行卡在键盘下面 | **没修好**，两次尝试都没中 |
            | 跑完手册快捷命令后栏与键盘之间裂开一条缝 | **没修好** |

            这两条都不影响 App 能不能用，先把能用的版本交出去。
            要修得拿到崩溃日志/真机对照才好下手，不猜了。

            ### 测一下

            ```
            杀掉 App 重开         → 能打开
            默认                  → 只有输入框和键盘，没有按键行
            点 ›                  → 拉出一行，↑ ↓ 加一排符号
            跑一条长命令          → 输入框最右边的红色 ^C 按得动，能中断
            命令跑完              → ^C 变灰
            ```

            ## v0.5.2：扩展键盘三处真机反馈

            ### 一、冷启动输入行卡在键盘底下 ← 这次最要紧的

            **现象**：刚打开 App，第一次点输入框，那一行会被压在键盘下面出不来；
            点一下 `›` 就自己好了，之后再点都正常。

            **`›` 凭什么能修好**，是解开这个 bug 的钥匙：`updateUIView` 里唯一会重建附件栏的
            时机就是切换符号页，而重建会 `reloadInputViews()`——那又引发一次键盘 frame 通知。

            也就是说：**键盘通知本来就到了，缺的是收到之后的重排**，
            而「重建一次附件栏」顺手把这次重排给做了。

            三处改动叠上去：

            | # | 改哪 | 为什么 |
            |---|---|---|
            | 1 | `reloadInputViews()` 从 `textFieldDidBeginEditing` 里挪到下一轮主循环 | 这个回调正好在键盘进场动画中途，这时候同步改输入视图排布，UIKit 有时把改动排到动画之后，App 侧 safe area 就对不上。**冷启动才犯**正是因为冷启动时键盘还在进场 |
            | 2 | 容器 `autoresizesSubviews = false`，子视图只留 `.flexibleWidth` | 之前有 `.flexibleHeight`：内容高度一旦写错，子视图会把容器撑大，UIKit 拿撑大的高度去排键盘，输入行直接被顶没 |
            | 3 | `ExtendedKeyboardBar` 加 `.ignoresSafeArea()` | 那个 `UIHostingController` 不在窗口里，拿到的安全区内边距是来路不明的假值 |
            | 4 | 输入行挂一个**恒为 0 高**的空视图当 overlay，只让 `keyboardEpoch` 参与布局计算 | 显式把重排做掉。**不能写成 `.id(keyboardEpoch)`**——那会重建 `UITextField`，光标和焦点全丢 |

            第 4 条只 bump 计数，**不拿它算任何偏移**：safe area 归 SwiftUI 自己管，
            两边都伸手去挪会叠成双倍位移，那比现在的毛病还难看。

            ### 二、两行同时出现时又高又松 ← 算错了，不是错觉

            ```
            之前：height() = controlRowHeight + symbolRowHeight * 2  = 46 + 84 = 130
                  但界面只画两行                              46 + 42 =  88
                  差 42pt —— 容器底部凭空多出一块空白
            ```

            所以看着「高高一截、跟键盘之间隔着一段空的」。
            真凶就一个 `* 2`，容器高度和实际渲染高度对不上。

            顺手把整条栏压紧（用户要求「非常紧凑」）：

            | | 之前 | 现在 |
            |---|---|---|
            | 控制行高 | 46 | **38** |
            | 符号行高 | 42 | **34** |
            | 按键最小高 | 32 | **26** |
            | 按键最小宽 | 40 | **36** |
            | 字号 | 15 | **14** |
            | 两行合计 | 88（显示 130） | **72** |

            行高改一个必须改两个地方（`KeyboardAccessory` 的常量和 `ExtendedKeyboardBar`
            的 `.frame`），这条已经写进注释了。

            ### 三、删格键 ⌫ 去掉，换成补全键 ⇥

            系统键盘本来就有退格，附件栏再放一个是重复。

            换成 **`⇥`（Tab → 取第一候选）**——iOS 键盘上没有 Tab，
            而 Tab 在 shell 里就是补全，这才是控制行真正缺的那个键。

            补全有候选就填，没候选**什么都不做**：刻意不插一个 `\t` 进去，
            TT 的输入是给 mksh 吃的，Tab 补不了的时候塞个制表符
            只会让命令以一个莫名其妙的错结束。

            ### 测一下

            ```
            冷启动 → 点输入框 → 输入行应该立刻浮到键盘正上方，不卡
            点 ›   → 符号页展开，总高度明显变矮，贴着键盘
            点 ⇥   → 有候选就补上（试试 ls 后接空格再点，或者输 cd / 后点）
            ⌫ 没了 → 退格用系统键盘上那个
            ```

            ## v0.5.1：修输入行被撑开 + 精简符号页 + 括号自动配对

            ### 1. 输入行上下空出一大截（v0.5.0 的真 bug）

            ```
            ┌──────────────────────────────┐
            │ [终端输出……]                 │
            │                              │
            │                              │  ← 本该没有的两大块空白
            │  ›  输入命令……          📋 ↑ │
            ├──────────────────────────────┤
            │ esc ↑ ↓ ← → ⌫ ^C            │  ← 附件栏
            └──────────────────────────────┘
            ```

            **原因**：`TerminalTextField` 是 `UIViewRepresentable`，
            `UITextField` 报给 SwiftUI 的固有高度不合适，放进 `HStack` 里**被纵向撑开**，
            于是输入行那整条 HStack 变成一大块，`›` 和发送箭头被顶到中间。

            **修法**：显式 `.frame(height: 34)`。
            （`sizeThatFits(_:uiView:context:)` 是 iOS 16 才有的，部署目标是 15，用不了。）

            ### 2. 符号页精简成一行

            `||` `&&` `>>` `2>&1` `~/` `../` 这些组合符号**全删了**——
            组合符号按两下就能打出来，专门给它一个键不值当，
            **附件栏的位置比符号数量值钱**。现在全是单个字符，一行：

            ```
            |  &  /  >  <  ;  ~  -  _  .  =  *  ?  '  "  $  #  %  !  @  [  ]  (  )
            ```

            控制行：`esc ↑ ↓ ← → ⌫ ^C`（7 个，不加 ctrl）

            ### 3. 括号引号自动配对（常开，没有开关）

            | 输入 | 结果 |
            |---|---|
            | `(` | 变成 `()`，光标停在中间 |
            | `[` | 变成 `[]`，光标停在中间 |
            | `"` | 变成 `""`，光标停在中间 |
            | 选中一段文字再按 `(` | 被 `(…)` 包起来 |
            | 在 `(` 后面再按一次 `(` | **光标跳过去**，不重复插 |

            附件栏上的键和系统键盘的键**行为一致**——
            两条路径都做了配对，`(` `( )` `'` `"` 这类在系统键盘的 123 层里也有，
            只做一边会出现"同一个括号有时配有时不配"。

            ### 验收

            ```
            1. 键盘弹起时，输入行紧贴在附件栏上方，**上下不再有空白**
            2. 终端输出区和输入行的高度恢复正常
            3. esc ↑ ↓ ← → ⌫ ^C 七个键都在
            4. 点 › 展开符号页，只有**一行**，可以横向滑动
            5. 符号页里没有 || && >> ~/ 之类的组合符号
            6. 打 ( → 出现 ()，光标在中间
            7. 在中间打内容 → 内容在括号里
            8. 再打一次 ( → 光标跳到 ) 后面，不多打一个
            9. 选中一段文字按 ( → 被包起来
            10. 系统键盘 123 层里打 ( → 同样配对
            11. ls + 空格 → 候选里 -l  -a  在前，路径在后
            12. ↑↓ 翻历史、←→ 移动光标、esc 清行、^C 杀进程都正常
            13. rm -rf / 仍弹「已拦截，不会执行」
            14. 终端里长按选择、复制菜单照常
            ```

            ## v0.5.0：扩展键盘

            iOS 系统键盘打不了 `|` `>` `~` `*` `;`，`esc` `^C` 完全没有，`&&` `2>&1` 要按四下。
            这一版补上。

            ### 放在系统键盘正上方，不占终端显示区

            做成 `inputAccessoryView`（附件栏）而不是 App 内的面板：
            系统键盘本来就吃掉一半屏幕，再在 App 里加一块面板就只剩几行输出了。

            ```
            ┌────────────────────────────────────────┐
            │ 输入 › ls -l /etc/ho█            📋 ↑ │  ← App 区域，完全不变
            ├────────────────────────────────────────┤
            │ esc  ↑  ↓  ←  →  ⌫  ^C           │  ← 附件栏（常驻）
            ├────────────────────────────────────────┤
            │ |  >  >>  <  2>  &  ;  ~  /  -  _     │  ← 符号页，点 › 展开
            │ .  =  *  '  "  `  $  #  %  !  ?  @     │
            ├────────────────────────────────────────┤
            │ q  w  e  r  t  y  u  i  o  p            │  ← 系统键盘照旧可用
            └────────────────────────────────────────┘
            ```

            输入框左侧的 `›` 是符号页开关：点一下展开，再点收起（变黄表示已展开）。
            控制键那一行始终在。

            ### 输入框换成了 `UITextField`

            扩展键盘要做光标移动（← →）、选中替换、↑↓ 翻历史回填，
            这些**全都依赖 `selectedTextRange`，SwiftUI 的 `TextField` 不暴露它**。
            换成 UIKit 之后 `inputAccessoryView` 也顺带变成原生能力。

            **这是本项目风险最高的一次改动**：输入框是所有功能的地基，换掉之后
            中文界面、长按选择、拖动选择、复制、输入历史、补全、危险命令拦截
            全部要重新验一遍。

            ### 各键定义

            | 键 | 行为 |
            |---|---|
            | `esc` | 清空当前输入行 |
                        | `^C` | 清空输入行；若有命令在跑就 `SIGKILL` 掉它 |
            | `↑` `↓` | 翻历史命令（只回填输入框，不动光标） |
            | `←` `→` | 光标左右移动一格，有选区时先取消选区 |
            | ⌫ | 退格。先删选区，没有选区就删光标前一个 |
            | 符号键 | 在光标处插入，有选区时先替换选区 |

            ^C 杀的是 `posix_spawn` 出来的直接子进程。TT 的执行器不用 shell 管进程组
            （fork 在本机是坏的），所以只能杀最外层这一个——
            单条命令下它就是命令本身，`&&` 链里只能杀掉当前这一段。

            ### 必须逐条验的回归

            输入框被换掉了，下面每一条都要重新确认：

            ```
            1. 点输入框能弹键盘，附件栏出现在系统键盘正上方
            2. 能打字、能删字、能发送，中文界面不变
            3. ls + 空格 → 候选里 -l  -a  在前，路径在后
            4. 点 › → 符号页展开，再点收起
            5. 点 | > >> < 2> & ; ~ / - _ . = * ' " ` $ # % ! ? @ → 插入到光标处
            8. ↑ → 回填上一条历史命令，连按可以往前翻；↓ 翻回来
            9. 输入 ls -l 然后按 ← ← → 看光标能不能移动
            10. esc → 输入行清空
            11. 起一条长命令（比如 find /），^C 能立刻停掉
            12. 终端里长按选择、拖动手柄、复制菜单照常
            13. rm -rf / 仍然弹「已拦截，不会执行」，只有「知道了」
            14. rm -rf /tmp/ttd 正常执行不弹窗
            15. 手册面板、复制全部、清空、历史记录按钮都正常
            ```

            ## v0.4.20：真凶找到了 —— `optionList` 的过滤顺序反了

            ### 一行代码，连挂五版

            ```swift
            firstClause.split(separator: " ").map(String.init)
                .filter { $0.hasPrefix("-") }                          // ← 先判断
                .map { $0.trimmingCharacters(in: CharacterSet(charactersIn: "[]")) }  // ← 后去括号
            ```

            手册里几乎所有选项都写成 **`[-l]`** 这种带方括号的占位形式，
            而 `"[-l]".hasPrefix("-")` 是 **false** —— 开头是 `[` 不是 `-`。

            **于是全部 33 条命令的 `optionList` 都返回空数组，补全条永远不出选项。**
            不是渲染问题，不是解析问题，是数据源本身就是空的。

            这个错从 `optionList` 引进那天起就在，四版修复全改在了下游
            （横杠怎么补、空格怎么补、split 的歧义、卡片 id），**没有一处碰过它**。

            修法：**先剥方括号，再判断是不是选项**。

            ```swift
            firstClause.split(separator: " ")
                .map { $0.trimmingCharacters(in: CharacterSet(charactersIn: "[]")) }
                .map { $0.trimmingCharacters(in: .whitespaces) }
                .filter { $0.hasPrefix("-") && $0.count > 1 }
            ```

            注意切分仍然在去括号**之前**：`[-c 列表]` 会切成 `[-c` 和 `列表]`，
            反过来就会拼出 `-c 列表` 这种带占位符的脏 token。

            ### 现在有选项的命令（19 条）

            | 命令 | 选项 | 命令 | 选项 |
