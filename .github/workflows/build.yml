name: TT 编译与发布

on:
  push:
    branches: [main, "v*"]
  workflow_dispatch:

concurrency:
  group: tt-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  # 单一版本来源：IPA 文件名、tag、产物名、Info.plist 校验全部引用这里。
  # 升版本只改这一行；分支用 v* 通配，不必再往 branches 里补版本号。
  VERSION: "0.4.9"

jobs:
  build:
    name: 编译 iOS 安装包
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: 获取项目源码
        uses: actions/checkout@v4

      - name: 检查苹果编译环境
        run: |
          xcode-select -p
          xcodebuild -version

      - name: 安装项目生成工具
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          fi
          xcodegen --version

      - name: 生成 TT 应用图标
        run: swift scripts/generate_icon.swift

      - name: 编译容器内探针程序 ttprobe
        run: |
          set -euo pipefail
          SYSROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun -sdk iphoneos clang -arch arm64 -isysroot "$SYSROOT" -O2 -o scripts/ttprobe scripts/ttprobe.c
          file scripts/ttprobe
          test -s scripts/ttprobe

      - name: 构建内置命令工具 ttbin
        run: |
          set -euo pipefail
          SYSROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          mkdir -p TT/ttbin
          for t in ls cat date whoami uname df wc head tail grep \
                   touch mkdir rm cp mv sort uniq cut tr du stat find; do
            xcrun -sdk iphoneos clang -arch arm64 -isysroot "$SYSROOT" -O2 -o "TT/ttbin/$t" "scripts/tttools/tt${t}.c"
          done
          xcrun -sdk iphoneos clang -arch arm64 -isysroot "$SYSROOT" -O2 -o TT/ttbin/ttfork scripts/tttools/ttfork.c
          file TT/ttbin/*

      - name: 构建内置 Shell mksh 并签名嵌套二进制
        run: bash scripts/build-mksh.sh

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 编译 iPhone 应用
        run: |
          set -euo pipefail
          xcodebuild \
            -project TT.xcodeproj \
            -scheme TT \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: 打包 IPA 安装包
        run: |
          set -euo pipefail
          APP="build/DerivedData/Build/Products/Release-iphoneos/TT.app"
          test -d "$APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist" | grep -Fx 'com.daofeidao.tt'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist" | grep -Fx "$VERSION"
          test -s "$APP/ttprobe"
          test -s "$APP/ttbin/mksh"
          for t in ls cat date whoami uname df wc head tail grep ttfork; do test -s "$APP/ttbin/$t"; done
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/TT.app
          /usr/bin/codesign --force --deep --sign - --entitlements tt.entitlements build/ipa/Payload/TT.app
          cd build/ipa
          /usr/bin/zip -qry "../TT-v$VERSION.ipa" Payload
          cd ../..
          test -s "build/TT-v$VERSION.ipa"
          echo "IPA 安装包已生成："
          ls -lh "build/TT-v$VERSION.ipa"
          /usr/bin/unzip -l "build/TT-v$VERSION.ipa" | head -40

      - name: 发布并上传 IPA
        if: github.ref == 'refs/heads/v0.4.9-autocomplete-dangerblock' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: TT v${{ env.VERSION }}（命令补全 + 危险命令硬拦截）
          body: |
            ## v0.4.9：命令自动补全 + 危险命令直接拦截

            ### 1. 输入命令时自动补全

            边打字边出候选，长命令和记不住的选项不用背。

            - 输入框正上方出现一排候选卡片，**命令名 + 完整用法**两行
            - **前缀匹配优先**，不够时再补"包含"匹配——只记得中间几个字母也搜得到
            - 最多 12 条，横向滚动
            - 点一下：**没打全就补成命令名**；**已经打全就把完整用法填进去**
              （那条卡片此时高亮描边，一眼能看出"再点一次会给模板"）
            - 只在**命令名那一段**出现；已经敲到第二个词（管道、参数、路径）自动隐藏，不打扰
            - 输入框失焦或清空时收起

            例：输入 `so` → 出现 `sort`；再点一次 → 填入 `sort [-n] [-r] [-u] [文件]`

            ### 2. 危险命令改为**直接拦截**

            上一版是"输密码放行"，这版按要求改成**不执行**，且**不提供任何绕过入口**。

            - 命中高危规则 → 弹出深红拦截面板，列出具体风险原因
            - 面板只有「知道了」一个按钮，**不能下拉关闭、不能确认执行**
            - 命令不会进入执行流程，输入框同时清空，避免反复触发
            - 关于面板的「危险操作密码」改成「高危命令拦截 · 已启用 · N 条规则」

            | 命中示例 | 提示的风险 |
            |---|---|
            | `rm -rf /`、`rm -rf ~` | 系统将无法启动 |
            | `rm -rf *` | 通配符递归删除，范围不可预估 |
            | `rm -rf /etc` 等关键目录 | 递归强删系统关键目录 |
            | `mkfs.*` / `newfs` | 格式化文件系统，不可恢复 |
            | `diskutil erase/reformat/...` | 彻底销毁磁盘数据 |
            | `dd if=... of=/dev/...` | 直接写入块设备 |
            | `> /dev/rdisk...` | 覆写磁盘原始数据 |
            | `chmod -R 777 /`、`chown -R … /` | 递归改根目录权限 |
            | `killall`、`kill -9 -1` | 批量结束系统进程 |
            | fork 炸弹 | 耗尽进程与 CPU |

            仍然**不拦** `rm -rf /tmp/ttd` 这类局部递归删除，否则测试清单会被整片挡下。

            两项改动分处不同区域（输入栏 / 执行闸门），互不影响，便于定位问题。

            **验收状态：** 编译 ⏳、IPA ⏳、**真机待复验**。
          files: build/TT-v${{ env.VERSION }}.ipa
          fail_on_unmatched_files: true
          make_latest: true

      - name: 上传备用编译产物
        uses: actions/upload-artifact@v4
        with:
          name: TT-v${{ env.VERSION }}-测试版-IPA
          path: build/TT-v${{ env.VERSION }}.ipa
          if-no-files-found: error
          retention-days: 14