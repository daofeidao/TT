name: TT 编译与发布

on:
  push:
    branches: [main, "v0.3.0-*"]
  workflow_dispatch:

concurrency:
  group: tt-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: 编译 iOS 安装包
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: 获取项目源码
        uses: actions/checkout@v4

      - name: 检查苹果编译环境
        run: |
          xcode-select -p
          xcodebuild -version

      - name: 安装项目生成工具
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          fi
          xcodegen --version

      - name: 生成 TT 应用图标
        run: swift scripts/generate_icon.swift

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 编译 iPhone 应用
        run: |
          set -euo pipefail
          xcodebuild \
            -project TT.xcodeproj \
            -scheme TT \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: 打包 IPA 安装包
        run: |
          set -euo pipefail
          APP="build/DerivedData/Build/Products/Release-iphoneos/TT.app"
          test -d "$APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist" | grep -Fx 'com.daofeidao.tt'
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/TT.app
          /usr/bin/codesign --force --deep --sign - build/ipa/Payload/TT.app
          cd build/ipa
          /usr/bin/zip -qry ../TT-v0.3.0.ipa Payload
          cd ../..
          test -s build/TT-v0.3.0.ipa
          echo "IPA 安装包已生成："
          ls -lh build/TT-v0.3.0.ipa
          /usr/bin/unzip -l build/TT-v0.3.0.ipa | head -40

      - name: 发布第三版并上传 IPA
        if: github.ref == 'refs/heads/v0.3.0-terminal-selection-shell' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.0
          name: TT 第三版（v0.3.0 测试版）
          body: |
            ## 第三版更新

            - 终端文本支持长按选择、拖动选区手柄与复制（原生 iOS 文本视图）。
            - 输入的命令通过设备上的 `/bin/sh` 真实执行，显示标准输出、错误输出与退出码。
            - Shell 启动失败时显示明确错误，不会把输入回显伪装成执行成功。
            - 保留中文界面、清空终端与输入历史。

            **重要说明：** v0.3.0 是命令执行链路的验证版本——每条命令单独启动一次 Shell，不是持久会话（`cd` 等状态不会保留到下一条命令）。能否在真机启动 `/bin/sh` 以实际设备结果为准。

            推荐测试命令：`pwd`、`ls`、`whoami`、`uname -a`、`date`

            最低部署版本：iOS 15.0，使用 TrollStore 安装测试。
          files: build/TT-v0.3.0.ipa
          fail_on_unmatched_files: true
          make_latest: true

      - name: 上传备用编译产物
        uses: actions/upload-artifact@v4
        with:
          name: TT-v0.3.0-测试版-IPA
          path: build/TT-v0.3.0.ipa
          if-no-files-found: error
          retention-days: 14
