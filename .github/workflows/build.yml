name: TT 编译与发布

on:
  push:
    branches: [main, "v*"]
  workflow_dispatch:

concurrency:
  group: tt-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  # 单一版本来源：IPA 文件名、tag、产物名、Info.plist 校验全部引用这里。
  # 升版本只改这一行；分支用 v* 通配，不必再往 branches 里补版本号。
  VERSION: "0.4.9"

jobs:
  build:
    name: 编译 iOS 安装包
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: 获取项目源码
        uses: actions/checkout@v4

      - name: 检查苹果编译环境
        run: |
          xcode-select -p
          xcodebuild -version

      - name: 安装项目生成工具
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          fi
          xcodegen --version

      - name: 生成 TT 应用图标
        run: swift scripts/generate_icon.swift

      - name: 编译容器内探针程序 ttprobe
        run: |
          set -euo pipefail
          SYSROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun -sdk iphoneos clang -arch arm64 -isysroot "$SYSROOT" -O2 -o scripts/ttprobe scripts/ttprobe.c
          file scripts/ttprobe
          test -s scripts/ttprobe

      - name: 构建内置命令工具 ttbin
        run: |
          set -euo pipefail
          SYSROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          mkdir -p TT/ttbin
          for t in ls cat date whoami uname df wc head tail grep \
                   touch mkdir rm cp mv sort uniq cut tr du stat find; do
            xcrun -sdk iphoneos clang -arch arm64 -isysroot "$SYSROOT" -O2 -o "TT/ttbin/$t" "scripts/tttools/tt${t}.c"
          done
          xcrun -sdk iphoneos clang -arch arm64 -isysroot "$SYSROOT" -O2 -o TT/ttbin/ttfork scripts/tttools/ttfork.c
          file TT/ttbin/*

      - name: 构建内置 Shell mksh 并签名嵌套二进制
        run: bash scripts/build-mksh.sh

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 编译 iPhone 应用
        run: |
          set -euo pipefail
          xcodebuild \
            -project TT.xcodeproj \
            -scheme TT \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: 打包 IPA 安装包
        run: |
          set -euo pipefail
          APP="build/DerivedData/Build/Products/Release-iphoneos/TT.app"
          test -d "$APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist" | grep -Fx 'com.daofeidao.tt'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist" | grep -Fx "$VERSION"
          test -s "$APP/ttprobe"
          test -s "$APP/ttbin/mksh"
          for t in ls cat date whoami uname df wc head tail grep ttfork; do test -s "$APP/ttbin/$t"; done
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/TT.app
          /usr/bin/codesign --force --deep --sign - --entitlements tt.entitlements build/ipa/Payload/TT.app
          cd build/ipa
          /usr/bin/zip -qry "../TT-v$VERSION.ipa" Payload
          cd ../..
          test -s "build/TT-v$VERSION.ipa"
          echo "IPA 安装包已生成："
          ls -lh "build/TT-v$VERSION.ipa"
          /usr/bin/unzip -l "build/TT-v$VERSION.ipa" | head -40

      - name: 发布并上传 IPA
        if: github.ref == 'refs/heads/v0.4.9-autocomplete-dangerblock' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: TT v${{ env.VERSION }}（修启动卡死：探针超时 + 布局活锁）
          body: |
            ## v0.4.9（三发）：修复启动即卡死的三个真凶

            > 覆盖前两次。初版是 10ms 瀑布流压死主线程；第二版去掉瀑布流后**仍然卡死**
            > ——说明我第一次的判断就是错的。这次不猜，把启动路径完整审了一遍，
            > 找到**三个**会互相叠加的硬问题。

            ### 元凶 1：fork 探针永久堵死管道（根本原因）

            本机 fork 必然 SIGBUS。`ttfork` 一旦 fork 出去，子进程在父进程被信号打死前
            **已经继承了管道写端**，于是父进程的 `read()` 永远等不到 EOF，
            `EnvironmentProbe.fullReport()` 永不返回，其后
            `DispatchQueue.main.async` 里的所有事——输出自检、弹键盘——**全都不执行**。

            三处修改：

            1. `read()` 改为 `poll()` + 总时限，不再裸等 EOF
            2. `waitpid()` 改为 `WNOHANG` 轮询 + 超时，超时则 `SIGKILL` 强制收尸
            3. **启动自检不再跑 `ttfork`**：结论早已被三轮实测确定（fork 不可用），
               每次开机再自杀一遍毫无价值。报告中标注「启动自检跳过，需手动运行 ttfork」

            探针统一走 **2 秒超时**；**用户命令仍然不限时**（`sleep 300` 不会被误杀）。

            ### 元凶 2：主线程阻塞调用被反复触发

            `UITextInputMode.activeInputModes`（枚举所有已装键盘）是**主线程同步阻塞**调用，
            多输入法环境下可能非常慢。而它挂在 `updateUIView` 里——`UIViewRepresentable`
            没有 diff，**SwiftUI 每次重渲染都无条件调用**。更糟的是 `wantsEnglishKeyboard`
            一旦置真就永不复位，此后每次 `isEditing && !isFirstResponder` 都会重新枚举一遍键盘。
            启动期重渲染极其密集（自检输出、滚动、键盘动画、补全条插入），
            累积起来就是「一打开就没反应」。

            1. `englishInputMode` 改为 `static let` 懒加载，**整个生命周期只算一次**
            2. Coordinator 加 `triedBecome` 闸门：`becomeFirstResponder()` 失败不重试；
               并在 `DispatchQueue.main.async` 里脱离 layout 事务再补一次

            ### 元凶 3：终端文本视图的布局自反馈活锁

            ```
            intrinsicContentSize → 每次被问都现场 sizeThatFits 做全量 CoreText 排版
            layoutSubviews        → invalidateIntrinsicContentSize()
                                       ↓ 安排下一轮 layout
                                 宽度抖动 > 0.5pt 就再次 invalidate  ← 活锁
            ```

            外层 `ScrollView` 用 `maxWidth: .infinity`，而 intrinsic 宽度是
            `noIntrinsicMetric`，正是抖动条件成立的土壤。启动时键盘弹起 + 滚动动画引爆。

            改为：**缓存排版高度**，只在文本真正变化或宽度变化时重排一次；
            `layoutSubviews` 里只置标记、**不再主动 invalidate**。

            ### 顺带加固

            `entitlementsSummary` 解析 Mach-O 的循环，迭代次数与步长都来自文件内容，
            不校验就会被数据驱动：`cmdSize == 0` 时 `offset` 永不推进 → 空转数十亿次。
            现已加 `cmdSize >= 8`、边界检查与 `ncmds` 上限 4096。

            ### 保留功能（本版未改）

            自动补全、危险命令硬拦截、扩展键盘（`›` 开关 + 管道符号行 +
            符号/F键开关 + `^C` 真 SIGINT）均按上一版实现保留。

            ### 验证要点

            ```
            1. 启动 App → 必须流畅，能看到完整自检报告
            2. 报告里 fork 探针那行应显示「启动自检跳过」
            3. 0.4 秒后键盘自动弹出（英文）
            4. 点 › 展开扩展键盘，测 | > & ; esc tab ^C ⌫ ← → ↑ ↓
            5. sleep 30 后点 ^C → 应被中断（验证没误杀长命令）
            6. 输入 so → 出现 sort
            7. rm -rf / → 拦截；rm -rf /tmp/ttd → 正常执行
            ```

            **验收状态：** 编译 ⏳、IPA ⏳、**真机待复验**。
          files: build/TT-v${{ env.VERSION }}.ipa
          fail_on_unmatched_files: true
          make_latest: true

      - name: 上传备用编译产物
        uses: actions/upload-artifact@v4
        with:
          name: TT-v${{ env.VERSION }}-测试版-IPA
          path: build/TT-v${{ env.VERSION }}.ipa
          if-no-files-found: error
          retention-days: 14
