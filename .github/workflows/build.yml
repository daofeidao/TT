name: TT 编译与发布

on:
  push:
    branches: [main, "v*"]
  workflow_dispatch:

concurrency:
  group: tt-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  # 单一版本来源：IPA 文件名、tag、产物名、Info.plist 校验全部引用这里。
  # 升版本只改这一行；分支用 v* 通配，不必再往 branches 里补版本号。
  VERSION: "0.3.7"

jobs:
  build:
    name: 编译 iOS 安装包
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: 获取项目源码
        uses: actions/checkout@v4

      - name: 检查苹果编译环境
        run: |
          xcode-select -p
          xcodebuild -version

      - name: 安装项目生成工具
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          fi
          xcodegen --version

      - name: 生成 TT 应用图标
        run: swift scripts/generate_icon.swift

      - name: 编译容器内探针程序 ttprobe
        run: |
          set -euo pipefail
          SYSROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun -sdk iphoneos clang -arch arm64 -isysroot "$SYSROOT" -O2 -o scripts/ttprobe scripts/ttprobe.c
          file scripts/ttprobe
          test -s scripts/ttprobe

      - name: 构建内置命令工具 ttbin
        run: |
          set -euo pipefail
          SYSROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          mkdir -p TT/ttbin
          for t in ls cat date whoami uname df wc head tail grep; do
            xcrun -sdk iphoneos clang -arch arm64 -isysroot "$SYSROOT" -O2 -o "TT/ttbin/$t" "scripts/tttools/tt${t}.c"
          done
          xcrun -sdk iphoneos clang -arch arm64 -isysroot "$SYSROOT" -O2 -o TT/ttbin/ttfork scripts/tttools/ttfork.c
          file TT/ttbin/*

      - name: 构建内置 Shell mksh 并签名嵌套二进制
        run: bash scripts/build-mksh.sh

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 编译 iPhone 应用
        run: |
          set -euo pipefail
          xcodebuild \
            -project TT.xcodeproj \
            -scheme TT \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: 打包 IPA 安装包
        run: |
          set -euo pipefail
          APP="build/DerivedData/Build/Products/Release-iphoneos/TT.app"
          test -d "$APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist" | grep -Fx 'com.daofeidao.tt'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist" | grep -Fx "$VERSION"
          test -s "$APP/ttprobe"
          test -s "$APP/ttbin/mksh"
          for t in ls cat date whoami uname df wc head tail grep ttfork; do test -s "$APP/ttbin/$t"; done
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/TT.app
          /usr/bin/codesign --force --deep --sign - --entitlements tt.entitlements build/ipa/Payload/TT.app
          cd build/ipa
          /usr/bin/zip -qry "../TT-v$VERSION.ipa" Payload
          cd ../..
          test -s "build/TT-v$VERSION.ipa"
          echo "IPA 安装包已生成："
          ls -lh "build/TT-v$VERSION.ipa"
          /usr/bin/unzip -l "build/TT-v$VERSION.ipa" | head -40

      - name: 发布并上传 IPA
        if: github.ref == 'refs/heads/v0.3.7-pipeline-hardening' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: TT v${{ env.VERSION }}（管道与进程执行稳定性修复）
          body: |
            ## v0.3.7：管道与进程执行稳定性修复

            ### 本版改动
            - 修复空管道输入被当成“没有 stdin”的问题；上游无输出时，下游仍会收到 EOF。
            - 修复父进程未关闭 stdin 文件描述符的问题，并检查输入文件写入与 spawn 文件操作错误。
            - stdout 与 stderr 分开捕获；管道只传递 stdout，错误信息不会混入下游输入。
            - 子进程执行设 15 秒上限；超时会终止并回收进程，避免终端无限卡住。
            - 修复内置 grep 的选项解析与 `grep -v` 行筛选行为。
            - 保留 v0.3.6 已修正的 ttfork 探针判定。

            ### 建议真机测试
            `echo abc | wc`、`grep -v foo 文件路径`、`ls /不存在的目录 | wc`、`sleep 20`（如果当前系统提供 sleep 命令，应在约 15 秒后返回超时提示）。

            **验收状态：** CI 编译与 IPA 打包通过后，再以真机结果确认运行时行为。
          files: build/TT-v${{ env.VERSION }}.ipa
          fail_on_unmatched_files: true
          make_latest: true

      - name: 上传备用编译产物
        uses: actions/upload-artifact@v4
        with:
          name: TT-v${{ env.VERSION }}-测试版-IPA
          path: build/TT-v${{ env.VERSION }}.ipa
          if-no-files-found: error
          retention-days: 14