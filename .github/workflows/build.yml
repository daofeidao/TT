name: TT 编译与发布

on:
  push:
    branches: [main, "v*"]
  workflow_dispatch:

concurrency:
  group: tt-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  # 单一版本来源：IPA 文件名、tag、产物名、Info.plist 校验全部引用这里。
  # 升版本只改这一行；分支用 v* 通配，不必再往 branches 里补版本号。
  VERSION: "0.4.9"

jobs:
  build:
    name: 编译 iOS 安装包
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: 获取项目源码
        uses: actions/checkout@v4

      - name: 检查苹果编译环境
        run: |
          xcode-select -p
          xcodebuild -version

      - name: 安装项目生成工具
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          fi
          xcodegen --version

      - name: 生成 TT 应用图标
        run: swift scripts/generate_icon.swift

      - name: 编译容器内探针程序 ttprobe
        run: |
          set -euo pipefail
          SYSROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun -sdk iphoneos clang -arch arm64 -isysroot "$SYSROOT" -O2 -o scripts/ttprobe scripts/ttprobe.c
          file scripts/ttprobe
          test -s scripts/ttprobe

      - name: 构建内置命令工具 ttbin
        run: |
          set -euo pipefail
          SYSROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          mkdir -p TT/ttbin
          for t in ls cat date whoami uname df wc head tail grep \
                   touch mkdir rm cp mv sort uniq cut tr du stat find; do
            xcrun -sdk iphoneos clang -arch arm64 -isysroot "$SYSROOT" -O2 -o "TT/ttbin/$t" "scripts/tttools/tt${t}.c"
          done
          xcrun -sdk iphoneos clang -arch arm64 -isysroot "$SYSROOT" -O2 -o TT/ttbin/ttfork scripts/tttools/ttfork.c
          file TT/ttbin/*

      - name: 构建内置 Shell mksh 并签名嵌套二进制
        run: bash scripts/build-mksh.sh

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 编译 iPhone 应用
        run: |
          set -euo pipefail
          xcodebuild \
            -project TT.xcodeproj \
            -scheme TT \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: 打包 IPA 安装包
        run: |
          set -euo pipefail
          APP="build/DerivedData/Build/Products/Release-iphoneos/TT.app"
          test -d "$APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist" | grep -Fx 'com.daofeidao.tt'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist" | grep -Fx "$VERSION"
          test -s "$APP/ttprobe"
          test -s "$APP/ttbin/mksh"
          for t in ls cat date whoami uname df wc head tail grep ttfork; do test -s "$APP/ttbin/$t"; done
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/TT.app
          /usr/bin/codesign --force --deep --sign - --entitlements tt.entitlements build/ipa/Payload/TT.app
          cd build/ipa
          /usr/bin/zip -qry "../TT-v$VERSION.ipa" Payload
          cd ../..
          test -s "build/TT-v$VERSION.ipa"
          echo "IPA 安装包已生成："
          ls -lh "build/TT-v$VERSION.ipa"
          /usr/bin/unzip -l "build/TT-v$VERSION.ipa" | head -40

      - name: 发布并上传 IPA
        if: github.ref == 'refs/heads/v0.4.9-autocomplete-dangerblock' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: TT v${{ env.VERSION }}（命令补全 + 危险拦截 + 修卡死）
          body: |
            ## v0.4.9（重发）：命令自动补全 + 危险命令拦截 + 修复开机卡死

            > 本版**覆盖**了同号的初版：初版一打开就卡死、无法使用，直接重发。
            > 特殊键盘按键不在本版，放在 **v0.5.0**。

            ### 1. 修复：开机跑自检时卡死

            **现象**：装上初版，一启动跑自检瀑布流就直接卡死。

            **根因**：瀑布流每 10ms 追加一行，而每追加一行都要
            **重建整份富文本 → 触发布局测量 → 再滚动一次**。
            一秒上百次这种主线程循环，加上同时在做输入框聚焦和键盘动画，
            把主线程彻底压死。这不是"动画不好看"的问题，是实打实的卡死。

            **修复**：取消瀑布流，**一次性输出**完整报告。
            末尾仍保留 `[TT] 启动自检完成 · N 行` 结论行。

            ### 2. 输出完成后自动弹键盘（英文）

            自检输出落定、延时 0.4 秒后自动聚焦输入框，**直接是英文输入模式**——
            命令基本都是 ASCII，省得每次手动切输入法。

            延时的原因：不等输出排版完就弹，键盘会盖住刚出来的末行。

            只在这一刻切英文，之后你想切回中文随时能切，不做强制。

            ### 3. 输入命令时自动补全

            输入框正上方出候选卡片，两行：**命令名 + 完整用法**。

            | 行为 | 说明 |
            |---|---|
            | 前缀匹配优先 | `so` → `sort` |
            | 补充"包含"匹配 | 只记得中间几个字母也搜得到 |
            | 点一下（没打全） | **补成命令名** |
            | 点一下（已打全） | **把完整用法填进去**，该卡片此时高亮描边 |
            | 出现时机 | 只在**命令名那一段**；敲到第二个词自动隐藏 |
            | 收起 | 输入框失焦或清空 |

            最多 12 条，横向滚动。

            ### 4. 危险命令直接拦截

            命中高危规则 → 深红面板，**不执行、不留任何绕过口**。
            面板只有「知道了」，不能下划关闭，输入框同时清空。

            | 命中示例 | 提示的风险 |
            |---|---|
            | `rm -rf /`、`rm -rf ~` | 系统将无法启动 |
            | `rm -rf *` | 通配符递归删除，范围不可预估 |
            | `rm -rf /etc` 等关键目录 | 递归强删系统关键目录 |
            | `mkfs.*` / `newfs` | 格式化文件系统，不可恢复 |
            | `diskutil erase/reformat/...` | 彻底销毁磁盘数据 |
            | `dd if=... of=/dev/...` | 直接写入块设备 |
            | `> /dev/rdisk...` | 覆写磁盘原始数据 |
            | `chmod -R 777 /`、`chown -R … /` | 递归改根目录权限 |
            | `killall`、`kill -9 -1` | 批量结束系统进程 |
            | fork 炸弹 | 耗尽进程与 CPU |

            仍然**不拦** `rm -rf /tmp/ttd` 这类局部递归删除，否则测试清单会被整片挡下。

            ### 真机测试要点

            ```
            1. 打开 App → 应流畅启动，不卡死
            2. 自检一次性输出完，末尾有绿色结论行
            3. 0.4 秒后键盘自动弹出，且是英文
            4. 输入 so → 出现 sort；点一下补全；再点一下出用法模板
            5. 输入 "cat " → 补全条消失
            6. rm -rf / → 拦截且不执行；rm -rf /tmp/ttd → 正常执行
            ```

            **验收状态：** 编译 ⏳、IPA ⏳、**真机待复验**。
          files: build/TT-v${{ env.VERSION }}.ipa
          fail_on_unmatched_files: true
          make_latest: true

      - name: 上传备用编译产物
        uses: actions/upload-artifact@v4
        with:
          name: TT-v${{ env.VERSION }}-测试版-IPA
          path: build/TT-v${{ env.VERSION }}.ipa
          if-no-files-found: error
          retention-days: 14