name: TT 编译与发布

on:
  push:
    branches: [main, "v*"]
  workflow_dispatch:

concurrency:
  group: tt-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  # 单一版本来源：IPA 文件名、tag、产物名、Info.plist 校验全部引用这里。
  # 升版本只改这一行；分支用 v* 通配，不必再往 branches 里补版本号。
  VERSION: "0.4.14"

jobs:
  build:
    name: 编译 iOS 安装包
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: 获取项目源码
        uses: actions/checkout@v4

      - name: 检查苹果编译环境
        run: |
          xcode-select -p
          xcodebuild -version

      - name: 安装项目生成工具
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          fi
          xcodegen --version

      - name: 生成 TT 应用图标
        run: swift scripts/generate_icon.swift

      - name: 编译容器内探针程序 ttprobe
        run: |
          set -euo pipefail
          SYSROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun -sdk iphoneos clang -arch arm64 -isysroot "$SYSROOT" -O2 -o scripts/ttprobe scripts/ttprobe.c
          file scripts/ttprobe
          test -s scripts/ttprobe

      - name: 构建内置命令工具 ttbin
        run: |
          set -euo pipefail
          SYSROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          mkdir -p TT/ttbin
          for t in ls cat date whoami uname df wc head tail grep \
                   touch mkdir rm cp mv sort uniq cut tr du stat find; do
            xcrun -sdk iphoneos clang -arch arm64 -isysroot "$SYSROOT" -O2 -o "TT/ttbin/$t" "scripts/tttools/tt${t}.c"
          done
          xcrun -sdk iphoneos clang -arch arm64 -isysroot "$SYSROOT" -O2 -o TT/ttbin/ttfork scripts/tttools/ttfork.c
          file TT/ttbin/*

      - name: 构建内置 Shell mksh 并签名嵌套二进制
        run: bash scripts/build-mksh.sh

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 编译 iPhone 应用
        run: |
          set -euo pipefail
          xcodebuild \
            -project TT.xcodeproj \
            -scheme TT \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: 打包 IPA 安装包
        run: |
          set -euo pipefail
          APP="build/DerivedData/Build/Products/Release-iphoneos/TT.app"
          test -d "$APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist" | grep -Fx 'com.daofeidao.tt'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist" | grep -Fx "$VERSION"
          test -s "$APP/ttprobe"
          test -s "$APP/ttbin/mksh"
          for t in ls cat date whoami uname df wc head tail grep ttfork; do test -s "$APP/ttbin/$t"; done
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/TT.app
          /usr/bin/codesign --force --deep --sign - --entitlements tt.entitlements build/ipa/Payload/TT.app
          cd build/ipa
          /usr/bin/zip -qry "../TT-v$VERSION.ipa" Payload
          cd ../..
          test -s "build/TT-v$VERSION.ipa"
          echo "IPA 安装包已生成："
          ls -lh "build/TT-v$VERSION.ipa"
          /usr/bin/unzip -l "build/TT-v$VERSION.ipa" | head -40

      - name: 发布并上传 IPA
        if: github.ref == 'refs/heads/v0.4.14-cascade-fix' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: TT v${{ env.VERSION }}（路径补全）
          body: |
            ## v0.4.13：路径补全（`cd` 后补目录，`/` 后继续补）

            基线 **v0.4.12**，本版**只加这一个功能**。

            ### 做什么

            在吃路径的命令后面补全路径，逐层向下：

            ```
            cd          → 候选：..  ~  以及当前目录下的各个子目录（都带 /）
            cd /e       → 候选：/etc/
            cd /var/m   → 候选：/var/mobile/  /var/mmap/
            cat /etc/ho → 候选：/etc/hosts
            ```

            **目录后面自动带 `/`**，补完可以接着往下补。

            | 命令 | 补什么 |
            |---|---|
            | `cd` `mkdir` | 只补**目录**，另加 `..`（上一级）和 `~`（用户主目录） |
            | `ls` `cat` `cp` `mv` `rm` `touch` `stat` `head` `tail` `wc` `grep` `du` | 文件和目录都补 |
            | `sort` `uniq` `cut` `tr` `echo` `pwd` `date` 等 | 不补路径（这些参数不是路径） |

            `~` 取的是 App 的当前目录对应的用户主目录；相对路径按**当前目录**解析，
            所以 `cd bin` 之后直接补 `ls ` 列的就是 `/bin` 的内容。

            细节：与 shell 习惯一致，**没显式打点号时不补隐藏文件**；打了点号才补。

            ### 关键：列目录不在 body 里做

            这是本版最要紧的实现约束。

            `body` 每次重渲染都会重算一遍被访问的属性——如果路径补全写成计算属性，
            就等于**每敲一个键、每重渲染一次都扫一次盘**。前几个版本把 App 卡死
            （瀑布流那次）就是同一个类型的错误：重活放在渲染路径上。

            所以这里的做法是：

            1. 由 `.onChange(of: command)` 触发，**不在 body 里算**
            2. **120ms 防抖**——连着打字时不会每键都算一次
            3. 放到**后台队列**，算完再回主线程写 `@State`
            4. **目录列表按目录缓存**，同一目录只扫一次
            5. 结果回填前先比对 token，**期间输入变了就丢弃过期结果**
            6. 执行完命令（尤其 `cd`）**清缓存**，重新扫

            另外限制单次最多 12 条，`/System` 这种上百条目的目录也不会一次涌出来。

            ### 没动的部分（v0.4.12 原样）

            - 补全的命令名匹配、`-` 之后补选项、横杠按需补
            - 危险命令按权限分级（非 root 确认放行 / root 硬拦截）
            - 自检一次性输出、无瀑布流、自检配色分层
            - 命令清单的分类筛选 / 编辑 / 自定义
            - 彩色显示、长按选择、复制、输入历史
            - 23 个内置命令 + mksh

            ### 验收

            ```
            1. 输入 "cd "     → 应列出当前目录下的子目录，都带 /
            2. 候选里应有 .. 和 ~
            3. 输入 "cd /e"   → 应出现 /etc/
            4. 输入 "cat /etc/ho" → 应出现 /etc/hosts
            5. 补到 /etc/ 后 → 候选应变成 /etc/ 下的内容
            6. 输入 "cd bin" 发送 → 再输入 "ls " → 应列出 /bin 的内容
            7. 输入 "echo "   → 不应出现路径候选（echo 参数不是路径）
            8. 连着快速打字 → 不应卡顿
            ```

            **验收状态：** 编译 ⏳、IPA ⏳、**真机待复验**。
          files: build/TT-v${{ env.VERSION }}.ipa
          fail_on_unmatched_files: true
          make_latest: true

      - name: 上传备用编译产物
        uses: actions/upload-artifact@v4
        with:
          name: TT-v${{ env.VERSION }}-测试版-IPA
          path: build/TT-v${{ env.VERSION }}.ipa
          if-no-files-found: error
          retention-days: 14
