name: TT 编译与发布

on:
  push:
    branches: [main, "v*"]
  workflow_dispatch:

concurrency:
  group: tt-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  # 单一版本来源：IPA 文件名、tag、产物名、Info.plist 校验全部引用这里。
  # 升版本只改这一行；分支用 v* 通配，不必再往 branches 里补版本号。
  VERSION: "0.4.10"

jobs:
  build:
    name: 编译 iOS 安装包
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: 获取项目源码
        uses: actions/checkout@v4

      - name: 检查苹果编译环境
        run: |
          xcode-select -p
          xcodebuild -version

      - name: 安装项目生成工具
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          fi
          xcodegen --version

      - name: 生成 TT 应用图标
        run: swift scripts/generate_icon.swift

      - name: 编译容器内探针程序 ttprobe
        run: |
          set -euo pipefail
          SYSROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun -sdk iphoneos clang -arch arm64 -isysroot "$SYSROOT" -O2 -o scripts/ttprobe scripts/ttprobe.c
          file scripts/ttprobe
          test -s scripts/ttprobe

      - name: 构建内置命令工具 ttbin
        run: |
          set -euo pipefail
          SYSROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          mkdir -p TT/ttbin
          for t in ls cat date whoami uname df wc head tail grep \
                   touch mkdir rm cp mv sort uniq cut tr du stat find; do
            xcrun -sdk iphoneos clang -arch arm64 -isysroot "$SYSROOT" -O2 -o "TT/ttbin/$t" "scripts/tttools/tt${t}.c"
          done
          xcrun -sdk iphoneos clang -arch arm64 -isysroot "$SYSROOT" -O2 -o TT/ttbin/ttfork scripts/tttools/ttfork.c
          file TT/ttbin/*

      - name: 构建内置 Shell mksh 并签名嵌套二进制
        run: bash scripts/build-mksh.sh

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 编译 iPhone 应用
        run: |
          set -euo pipefail
          xcodebuild \
            -project TT.xcodeproj \
            -scheme TT \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: 打包 IPA 安装包
        run: |
          set -euo pipefail
          APP="build/DerivedData/Build/Products/Release-iphoneos/TT.app"
          test -d "$APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist" | grep -Fx 'com.daofeidao.tt'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist" | grep -Fx "$VERSION"
          test -s "$APP/ttprobe"
          test -s "$APP/ttbin/mksh"
          for t in ls cat date whoami uname df wc head tail grep ttfork; do test -s "$APP/ttbin/$t"; done
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/TT.app
          /usr/bin/codesign --force --deep --sign - --entitlements tt.entitlements build/ipa/Payload/TT.app
          cd build/ipa
          /usr/bin/zip -qry "../TT-v$VERSION.ipa" Payload
          cd ../..
          test -s "build/TT-v$VERSION.ipa"
          echo "IPA 安装包已生成："
          ls -lh "build/TT-v$VERSION.ipa"
          /usr/bin/unzip -l "build/TT-v$VERSION.ipa" | head -40

      - name: 发布并上传 IPA
        if: github.ref == 'refs/heads/v0.4.10-clean-template' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: TT v${{ env.VERSION }}（补全模板去方括号与路径）
          body: |
            ## v0.4.10：补全"已打全"时填入可执行骨架

            基线 **v0.4.9**，本版**只修这一处**。

            ### 问题

            对已打全的命令再点一次候选，会填入
            `sort [-n] [-r] [-u] [文件]`。但那是**给人看的说明写法**，
            直接当命令用必然出错：

            - `[` `]` 会被 shell 当成字面量，不做任何转义
            - `[文件]` 是占位说明，不是真实路径

            ### 修法

            在 `CommandDoc` 上加一个 `insertTemplate`，从说明式的 `syntax`
            反推一份**可执行骨架**：只保留命令名和以 `-` 开头的选项，
            其余（路径、文件、分隔符、模式等占位）一律丢掉。

            | 补全填入（改前） | 补全填入（改后） |
            |---|---|
            | `sort [-n] [-r] [-u] [文件]` | `sort -n -r -u` |
            | `ls [-l] [-a] [路径]` | `ls -l -a` |
            | `rm [-f] 文件... / rm -r [-f] 目录` | `rm -f` |
            | `cut -d 分隔符 -f 列表 [-c 列表]` | `cut -d -f -c` |
            | `grep [-i] [-v] [-n] 模式 [文件]` | `grep -i -v -n` |
            | `cat 文件...` | `cat` |

            `cut` 这条最能说明为什么不能只去方括号：`分隔符`、`列表` 是占位说明，
            去掉方括号后填进去照样报错。只保留选项才是能跑的骨架。

            手册里 32 条 syntax 全部推演过，没有畸形结果。

            **候选卡片上显示的仍是完整说明**（带方括号）——那里是给人读的，
            保持原样；只有点进输入框时才换成可执行骨架。

            ### 没动的部分（v0.4.9 原样）

            - 补全的匹配规则、前缀/包含匹配、最多 12 条、第二个词自动收起
            - 自检一次性输出、无瀑布流
            - 自检配色分层
            - 危险命令拦截（仍是**输密码放行**版）
            - 命令清单的分类筛选 / 编辑 / 自定义
            - 彩色显示、长按选择、复制、输入历史
            - 23 个内置命令 + mksh

            ### 验收

            ```
            1. 输入 so → 出现 sort
            2. 点一次 → 变成 sort
            3. 再点一次 → 应变成 "sort -n -r -u"（没有方括号、没有 [文件]）
            4. 输入 ls 再点两次 → 应变成 "ls -l -a"
            5. 输入 rm 再点两次 → 应变成 "rm -f"（不是带斜杠的后半段）
            6. 输入 cat 再点两次 → 应变成 "cat"
            7. 点一次（没打全）仍然只是补命令名，不受影响
            ```

            **验收状态：** 编译 ⏳、IPA ⏳、**真机待复验**。
          files: build/TT-v${{ env.VERSION }}.ipa
          fail_on_unmatched_files: true
          make_latest: true

      - name: 上传备用编译产物
        uses: actions/upload-artifact@v4
        with:
          name: TT-v${{ env.VERSION }}-测试版-IPA
          path: build/TT-v${{ env.VERSION }}.ipa
          if-no-files-found: error
          retention-days: 14
