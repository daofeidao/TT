name: TT 编译与发布

on:
  push:
    branches: [main, "v*"]
  workflow_dispatch:

concurrency:
  group: tt-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  # 单一版本来源：IPA 文件名、tag、产物名、Info.plist 校验全部引用这里。
  # 升版本只改这一行；分支用 v* 通配，不必再往 branches 里补版本号。
  VERSION: "0.4.4"

jobs:
  build:
    name: 编译 iOS 安装包
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: 获取项目源码
        uses: actions/checkout@v4

      - name: 检查苹果编译环境
        run: |
          xcode-select -p
          xcodebuild -version

      - name: 安装项目生成工具
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          fi
          xcodegen --version

      - name: 生成 TT 应用图标
        run: swift scripts/generate_icon.swift

      - name: 编译容器内探针程序 ttprobe
        run: |
          set -euo pipefail
          SYSROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun -sdk iphoneos clang -arch arm64 -isysroot "$SYSROOT" -O2 -o scripts/ttprobe scripts/ttprobe.c
          file scripts/ttprobe
          test -s scripts/ttprobe

      - name: 构建内置命令工具 ttbin
        run: |
          set -euo pipefail
          SYSROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          mkdir -p TT/ttbin
          for t in ls cat date whoami uname df wc head tail grep \
                   touch mkdir rm cp mv sort uniq cut tr du stat find; do
            xcrun -sdk iphoneos clang -arch arm64 -isysroot "$SYSROOT" -O2 -o "TT/ttbin/$t" "scripts/tttools/tt${t}.c"
          done
          xcrun -sdk iphoneos clang -arch arm64 -isysroot "$SYSROOT" -O2 -o TT/ttbin/ttfork scripts/tttools/ttfork.c
          file TT/ttbin/*

      - name: 构建内置 Shell mksh 并签名嵌套二进制
        run: bash scripts/build-mksh.sh

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 编译 iPhone 应用
        run: |
          set -euo pipefail
          xcodebuild \
            -project TT.xcodeproj \
            -scheme TT \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: 打包 IPA 安装包
        run: |
          set -euo pipefail
          APP="build/DerivedData/Build/Products/Release-iphoneos/TT.app"
          test -d "$APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist" | grep -Fx 'com.daofeidao.tt'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist" | grep -Fx "$VERSION"
          test -s "$APP/ttprobe"
          test -s "$APP/ttbin/mksh"
          for t in ls cat date whoami uname df wc head tail grep ttfork; do test -s "$APP/ttbin/$t"; done
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/TT.app
          /usr/bin/codesign --force --deep --sign - --entitlements tt.entitlements build/ipa/Payload/TT.app
          cd build/ipa
          /usr/bin/zip -qry "../TT-v$VERSION.ipa" Payload
          cd ../..
          test -s "build/TT-v$VERSION.ipa"
          echo "IPA 安装包已生成："
          ls -lh "build/TT-v$VERSION.ipa"
          /usr/bin/unzip -l "build/TT-v$VERSION.ipa" | head -40

      - name: 发布并上传 IPA
        if: github.ref == 'refs/heads/v0.4.4-manual-danger' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: TT v${{ env.VERSION }}（命令手册 + 危险操作确认）
          body: |
            ## v0.4.4：命令手册 + 高危操作二次确认

            ### 1. 命令清单 ⋯ 菜单新增「查看全部命令」

            把内置命令的说明集中到一处，随时可查。

            - **两种排序**：顶部分段控件切换「按功能分区 / 按字母顺序」
            - **五种分区**：文件与目录、文本处理、信息查询、Shell 内建、诊断探针
            - **搜索框**：命令名、语法、用途说明都能搜
            - 每条列出 **名称 / 用法 / 作用**，共 34 条

            | 分区 | 命令 |
            |---|---|
            | 文件与目录 | `ls` `touch` `mkdir` `rm` `cp` `mv` |
            | 文本处理 | `cat` `head` `tail` `wc` `grep` `sort` `uniq` `cut` `tr` |
            | 信息查询 | `df` `du` `stat` `find` `date` `whoami` `uname` |
            | Shell 内建 | `echo` `pwd` `cd` `true` `false` `test` `sleep` `clear` |
            | 诊断探针 | `ttfork` `ttprobe` |

            ### 2. 高危操作：红色警告 + 密码确认

            命中高危规则的命令在执行前弹出**深红警示面板**，列出具体风险原因，
            必须输入确认密码才会真正执行；输错只提示不执行。

            | 命中示例 | 提示的风险 |
            |---|---|
            | `mkfs.*` / `newfs` | 格式化文件系统，分区清空且不可恢复 |
            | `diskutil erase/reformat/...` | 彻底销毁磁盘数据 |
            | `dd if=... of=/dev/...` | 直接写入块设备，覆盖整个分区 |
            | `> /dev/rdisk...` | 覆写磁盘原始数据 |
            | `rm -rf /`、`rm -rf ~` | 系统将无法启动 |
            | `rm -rf *` | 通配符递归删除，范围不可预估 |
            | `rm -rf /etc` 等关键目录 | 递归强删系统关键目录 |
            | `chmod -R 777 /`、`chown -R … /` | 递归改根目录权限/属主 |
            | `killall`、`kill -9 -1` | 批量结束系统进程 |
            | fork 炸弹 | 瞬间耗尽进程与 CPU |

            **刻意不拦什么**：像 `rm -rf /tmp/ttd` 这种局部递归删除照常执行，
            否则每跑一次测试清单都要被打断一次。规则只覆盖真正不可逆、
            或影响整机的操作。

            初始确认密码为 `tt`（存本机）。清单里的命令同样走这道拦截，不能绕过。

            ### 不含

            本版不含键盘改造。特殊键盘按键（`esc tab ↑ ↓ ← → ^C` 等带开关的
            扩展键位）计划放在 **v0.5** 单独一版。

            **验收状态：** 编译 ⏳、IPA ⏳、**真机待复验**。
          files: build/TT-v${{ env.VERSION }}.ipa
          fail_on_unmatched_files: true
          make_latest: true

      - name: 上传备用编译产物
        uses: actions/upload-artifact@v4
        with:
          name: TT-v${{ env.VERSION }}-测试版-IPA
          path: build/TT-v${{ env.VERSION }}.ipa
          if-no-files-found: error
          retention-days: 14