name: TT 编译与发布

on:
  push:
    branches: [main, "v*"]
  workflow_dispatch:

concurrency:
  group: tt-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  # 单一版本来源：IPA 文件名、tag、产物名、Info.plist 校验全部引用这里。
  # 升版本只改这一行；分支用 v* 通配，不必再往 branches 里补版本号。
  VERSION: "0.4.7"

jobs:
  build:
    name: 编译 iOS 安装包
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: 获取项目源码
        uses: actions/checkout@v4

      - name: 检查苹果编译环境
        run: |
          xcode-select -p
          xcodebuild -version

      - name: 安装项目生成工具
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          fi
          xcodegen --version

      - name: 生成 TT 应用图标
        run: swift scripts/generate_icon.swift

      - name: 编译容器内探针程序 ttprobe
        run: |
          set -euo pipefail
          SYSROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun -sdk iphoneos clang -arch arm64 -isysroot "$SYSROOT" -O2 -o scripts/ttprobe scripts/ttprobe.c
          file scripts/ttprobe
          test -s scripts/ttprobe

      - name: 构建内置命令工具 ttbin
        run: |
          set -euo pipefail
          SYSROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          mkdir -p TT/ttbin
          for t in ls cat date whoami uname df wc head tail grep \
                   touch mkdir rm cp mv sort uniq cut tr du stat find; do
            xcrun -sdk iphoneos clang -arch arm64 -isysroot "$SYSROOT" -O2 -o "TT/ttbin/$t" "scripts/tttools/tt${t}.c"
          done
          xcrun -sdk iphoneos clang -arch arm64 -isysroot "$SYSROOT" -O2 -o TT/ttbin/ttfork scripts/tttools/ttfork.c
          file TT/ttbin/*

      - name: 构建内置 Shell mksh 并签名嵌套二进制
        run: bash scripts/build-mksh.sh

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 编译 iPhone 应用
        run: |
          set -euo pipefail
          xcodebuild \
            -project TT.xcodeproj \
            -scheme TT \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: 打包 IPA 安装包
        run: |
          set -euo pipefail
          APP="build/DerivedData/Build/Products/Release-iphoneos/TT.app"
          test -d "$APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist" | grep -Fx 'com.daofeidao.tt'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist" | grep -Fx "$VERSION"
          test -s "$APP/ttprobe"
          test -s "$APP/ttbin/mksh"
          for t in ls cat date whoami uname df wc head tail grep ttfork; do test -s "$APP/ttbin/$t"; done
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/TT.app
          /usr/bin/codesign --force --deep --sign - --entitlements tt.entitlements build/ipa/Payload/TT.app
          cd build/ipa
          /usr/bin/zip -qry "../TT-v$VERSION.ipa" Payload
          cd ../..
          test -s "build/TT-v$VERSION.ipa"
          echo "IPA 安装包已生成："
          ls -lh "build/TT-v$VERSION.ipa"
          /usr/bin/unzip -l "build/TT-v$VERSION.ipa" | head -40

      - name: 发布并上传 IPA
        if: github.ref == 'refs/heads/v0.4.7-scroll-fix' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: TT v${{ env.VERSION }}（滚动修复 + 自检配色）
          body: |
            ## v0.4.7：滚动失效修复 + 自检配色分层

            ### 1. 报告出来了但不往上滚（真机确认的 bug）

            **根因**：滚动用的是 `withAnimation(0.2s)`，而瀑布流每 10~30ms 就来一行。
            每来一行就**重新启动一次** 0.2 秒的动画，动画被反复打断重启，
            每轮只推进一小段就再次被打断——累积起来就是"卡住不动"。

            **修复**：按场景分开处理。

            | 场景 | 滚动方式 | 理由 |
            |---|---|---|
            | **追加输出** | **关闭动画，瞬时到位** | 每行瞬时贴底，才有终端刷屏的干脆感 |
            | 键盘弹出/收起 | 保留 0.2s 动画 | 需要跟键盘升降同步，慢一点才自然 |

            关闭动画用 `Transaction.disablesAnimations`，而不是去掉 `withAnimation`，
            以免和父层的隐式动画叠加出别的问题。

            ### 2. 间隔 30ms → 10ms

            整体耗时从约 1.2 秒压到约 0.4 秒，快到接近终端刷屏。

            ### 3. 自检跑完自动弹出键盘

            加了 `@FocusState` 绑定输入框，全部输出落定、延时 350ms 后自动聚焦，
            键盘升起、光标就绪，**落点可以直接打字**。

            延时的原因：不等排版完就弹，键盘会把刚滚上来的末行盖住。

            ### 4. 自检配色分层

            原来整份报告四十多行是同一个暗紫 `#7E7AA2`，长标签和短取值糊在一起，
            看不出主次。现在按行内位置分层：

            | 内容 | 颜色 | 说明 |
            |---|---|---|
            | `── 启动自检 ──` 分隔标题 | 淡蓝灰 `#BFD4DD` 加粗 | 一眼分节 |
            | `[TT] 进程：` 等**标签名** | 灰白 `#E2E2E7` | 你要的"浅色" |
            | 冒号后的**取值** | 暗灰 `#737182` | 压暗后退到背景 |
            | 无前缀的裸输出（fork 探针原文） | 暗灰 `#737182` | 纯噪声 |

            只对自检行生效；命令输出、`grep error` 里的 "error" 等一律不受影响。

            **验收状态：** 编译 ⏳、IPA ⏳、**真机待复验**。
          files: build/TT-v${{ env.VERSION }}.ipa
          fail_on_unmatched_files: true
          make_latest: true

      - name: 上传备用编译产物
        uses: actions/upload-artifact@v4
        with:
          name: TT-v${{ env.VERSION }}-测试版-IPA
          path: build/TT-v${{ env.VERSION }}.ipa
          if-no-files-found: error
          retention-days: 14