name: TT 编译与发布

on:
  push:
    branches: [main, "v*"]
  workflow_dispatch:

concurrency:
  group: tt-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  # 单一版本来源：IPA 文件名、tag、产物名、Info.plist 校验全部引用这里。
  # 升版本只改这一行；分支用 v* 通配，不必再往 branches 里补版本号。
  VERSION: "0.9.2"

jobs:
  build:
    name: 编译 iOS 安装包
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: 获取项目源码
        uses: actions/checkout@v4

      - name: 检查苹果编译环境
        run: |
          xcode-select -p
          xcodebuild -version

      - name: 安装项目生成工具
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          fi
          xcodegen --version

      - name: 生成 TT 应用图标
        run: swift scripts/generate_icon.swift

      - name: 编译容器内探针程序 ttprobe
        run: |
          set -euo pipefail
          SYSROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun -sdk iphoneos clang -arch arm64 -isysroot "$SYSROOT" -O2 -o scripts/ttprobe scripts/ttprobe.c
          file scripts/ttprobe
          test -s scripts/ttprobe

      - name: 构建内置命令工具 ttbin
        run: |
          set -euo pipefail
          SYSROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          mkdir -p TT/ttbin
          for t in ls cat date whoami uname df wc head tail grep \
                   touch mkdir rm cp mv sort uniq cut tr du stat find seq tee nl \
                   base64 xxd basename dirname which id; do
            xcrun -sdk iphoneos clang -arch arm64 -isysroot "$SYSROOT" -O2 -o "TT/ttbin/$t" "scripts/tttools/tt${t}.c"
          done
          xcrun -sdk iphoneos clang -arch arm64 -isysroot "$SYSROOT" -O2 -o TT/ttbin/ttfork scripts/tttools/ttfork.c
          file TT/ttbin/*

      - name: 构建内置 Shell mksh 并签名嵌套二进制
        run: bash scripts/build-mksh.sh

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 编译 iPhone 应用
        run: |
          set -euo pipefail
          xcodebuild \
            -project TT.xcodeproj \
            -scheme TT \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: 打包 IPA 安装包
        run: |
          set -euo pipefail
          APP="build/DerivedData/Build/Products/Release-iphoneos/TT.app"
          test -d "$APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist" | grep -Fx 'com.daofeidao.tt'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist" | grep -Fx "$VERSION"
          test -s "$APP/ttprobe"
          test -s "$APP/ttbin/mksh"
          # **ttbin 里每一个二进制都必须带 entitlements 签名。**
          # 漏签的后果不是构建失败，而是装到手机上执行时被 AMFI SIGKILL
          # （信号 9 / 退出码 137），真机表现为「命令莫名其妙被 9 终止」，
          # 跟 C 代码本身毫无关系——极难定位，所以在这里硬卡一道。
          # 加了新工具却忘了改 build-mksh.sh 的签名清单，这事已经发生过两次。
          for bin in "$APP"/ttbin/*; do
            test -s "$bin"
            /usr/bin/codesign -d --entitlements - "$bin" 2>/dev/null | grep -q "no-sandbox" || {
              echo "::error::嵌套二进制未签名或缺 entitlements，装到手机上会被 SIGKILL: $bin"
              exit 1
            }
          done
          echo "ttbin 签名自检通过（$(ls -1 "$APP"/ttbin/* | wc -l | tr -d ' ') 个）"
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/TT.app
          /usr/bin/codesign --force --deep --sign - --entitlements tt.entitlements build/ipa/Payload/TT.app
          cd build/ipa
          /usr/bin/zip -qry "../TT-v$VERSION.ipa" Payload
          cd ../..
          test -s "build/TT-v$VERSION.ipa"
          echo "IPA 安装包已生成："
          ls -lh "build/TT-v$VERSION.ipa"
          /usr/bin/unzip -l "build/TT-v$VERSION.ipa" | head -40

      - name: 发布并上传 IPA
        if: startsWith(github.ref, 'refs/heads/v') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: TT v${{ env.VERSION }}（修正测试清单里一条我写错的期望 + 写清 mksh 不支持什么）
          body: |
            ## v0.9.2：修我自己的错——一条从一开始就不该存在的测试期望

            真机跑测试清单，报了这条：

            ```
            for i in {1..5}; do echo 第 $i; done
            [TT] 控制流：整段交给内置 mksh
            第 {1..5}          ← 期望是「第 1」到「第 5」五行
            ```

            ### 根因：内置 mksh 根本没有花括号展开

            不是 TT 的问题，也不是这版引入的（那行提示说明它确实整段交给了 mksh）。

            为此在 CI 上加了一个**只探行为、不打包**的 workflow，
            在 macOS runner 上编一份**宿主机** mksh（R59c，与打进 App 的同一份源码）
            把各种写法跑一遍。实测结果：

            | 写法 | 结果 |
            |---|---|
            | `echo {1..5}` | `{1..5}` 原样 |
            | `set -B` | `set: -B: unknown option` —— 这个选项不存在 |
            | `set -o ksh93` | `set: ksh93: unknown option` —— 也不存在 |
            | `set -o braceexpand` | 选项存在，但**完全无效** |
            | `for ((i=0;i<3;i++))` | `syntax error: unexpected '(('` |

            也就是说**没有任何开关能打开它**，R59c 就是没这个特性。

            同一轮探针把其余写法全试了一遍，全对：
            `for` / `if` / `elif` / `while` / `case` / 嵌套 `for` / `glob` /
            变量与算术 / `export` / `&&` / `||` / 管道 / 重定向与追加重定向 / `read`。

            ### 我错在哪

            那条 `{1..5}` 的期望是**我写进测试清单时凭「shell 都这样」的印象假设的**，
            从没验过——于是一条根本不可能通过的用例，成了「必须全绿」里的一项。
            真机上每次跑都会红，而红的原因是**用例本身错了**，不是 App 有毛病。

            ### 这次改了什么

            - ⑥ 控制流回归：那条改成能通过的 `for i in 1 2 3 4 5; do echo 第 $i; done`，
              另加一条**嵌套 for**（之前只在真机手验过，没进清单）。
            - 新增 **⑧ 内置 mksh 不支持的写法** 分组，把三条「不是 TT 的 bug」写进去：
              `{1..5}`、`for ((...))`、`echo {a,b,c}`，每条都注明替代写法。
              这样真机上撞到会知道去哪看，而不是以为 App 坏了。
            - `seq` 的说明补上：它就是范围循环的替代写法
              （`for i in $(seq 1 5)` 同样受 fork 限制，所以更实际的是直接列全）。

            ### 顺带留下了探针这个工具

            `.github/workflows/mksh-probe.yml` + `scripts/build-mksh-host.sh` +
            `scripts/mksh_probe.sh`。以后再问「这份 mksh 到底支持什么」，
            推到 `probe/**` 分支跑一遍就有答案，**不用改版本号、不发 Release**
            （推 `v*` 会连带触发打包，而 action-gh-release 碰到已存在的 tag
            会重传附件，等于覆盖已定版的 IPA）。

            顺带一提：同一轮探针也独立印证了 v0.9.1 修对了——
            `x=10; echo $((x*2)) 和 ${x} 和 ${#x}` 在 mksh 上本来就出 `20 和 10 和 2`，
            说明之前是 TT 没把它整段送过去，而不是 mksh 不会算。

            ## v0.9.1：两个真 bug，都是 v0.9.0 的测试清单亲手抓出来的

            真机跑了一遍测试清单，立刻报了两条：

            ```
            which 不存在的命令 && echo 找到了 || echo 没找到   → 【命令没有输出。退出1】
            x=10; echo $((x*2)) 和 ${x} 和 ${#x}               → 0 和 和 0
            x=1; y=2; echo $x$y                                 → 【命令没有输出】
            ```

            ### 一、`x=10; echo $x` 从来就没生效过（v0.8.2 的修复是空转的）

            `x=10; echo $x` 该走「整行交给 mksh」才能保住变量，但它没走——
            `ControlFlowDetector.isAssignment` 写成了这样：

            ```swift
            for character in lower.dropFirst() {
                if (字母数字下划线) { continue }
                return false            // ← `=` 不是字母数字，直接判 false
            }
            return word.contains("=")    // ← 永远走不到
            ```

            意图是「标识符后面紧跟等号」，实现成了「后面必须全是标识符字符」。
            于是**任何赋值都判不出**，`hasStatefulAssignment` 恒假，
            v0.8.2 发布说明里写的那个修复**从来没有真正执行过**。
            改成等价于正则 `^[A-Za-z_][A-Za-z0-9_]*=` 的逐字符判定。

            ### 二、`a && b || c` 跳掉一段就掐断了整条链

            分段执行里判该不该跳过时用的是 `break`：

            ```swift
            if precedingSeparator == "&&" && lastExitCode != 0 { break }   // → continue
            if precedingSeparator == "||" && lastExitCode == 0 { break }   // → continue
            ```

            真 shell 是**逐段按同一条规则**判断的：`which` 失败 → 跳过 `echo 找到了`，
            此时整条链的状态**仍是失败** → `|| echo 没找到` 照样要跑。
            `break` 让 c 也跟着没了，于是整条链一个字都不输出，只留退出码 1。
            改成 `continue`：跳过的段不算、`lastExitCode` 原样保留，
            正是真 shell「被跳过的段不改变状态」的行为。

            ### 三、顺手补上 cd 保护

            变量赋值这条路以前是死代码，所以注释里写的
            「不管 cd，cd 那条仍然走分段路径」**从未被真正执行过**。
            现在它第一次生效，就必须把 cd 的保证保住：
            整行交给 mksh 的话，改的是 mksh 子进程的 cwd，TT 的当前目录不跟着动。
            新增 `hasTopLevelCd`，`cd` 与赋值同时出现时**保 cd**——
            目录不跟是静默的、反复咬人的，变量没设好是一眼能看见的。

            （写这个判定时自己踩了一次：分隔符后面的那个空格会把「段首」标记清掉，
            导致真正的 `cd` 永远轮不到被检查，保护**静默失效**。有注释标住。）

            ### 为什么 51 例自检全绿却没抓到

            这才是本次最值得记的事。

            `controlflow_selftest.ps1` 是 Swift 逻辑的 **PowerShell 移植版**。
            移植版的赋值判定用的是**正则**，是对的，所以 51 例全绿——
            **而 Swift 那边是错的，移植版够不着它**。
            `completion_selftest.ps1` 同理，`optionList` 漏了按 `|` 拆也是这么漏掉的。

            另外分段执行的 `&&` / `||` 判断**从来没有任何测试覆盖**，因为它不在判定层、
            整套 runner 也没被移植。

            对策：
            - 给两个脚本的头部加上警告，写明这是移植版、分叉过一次、绿灯是假的。
            - 把 `&&` / `||` 的跳过判断移植进自检（本版新增 11 例）。
            - 新增一节「防分叉」：**直接查 Swift 源码**里那几行还在不在，
              以及把 bug 引进来的三种写法（`break` / `contains("=")` / 手译 isAssignment）
              确认已经不在源码里。改了 Swift 却没改脚本时，至少这里会红。
            - **真正的兜底还是真机执行**——这次就是测试清单抓到的。

            自检从 156 例增到 **182 例**（危险命令 65 + 补全 40 + 控制流 77）。

            ## v0.9.0：手册里内置自测清单 + 修两个补全 bug

            ### 一、命令手册新增第三个分区「测试清单」

            顶部切到**「测试清单」**，每一版要验的语句已经全部写在里面，
            **点一条直接执行**，下面那行灰字就是该看到什么。不用再一条一条手敲。

            ```
            ① 不该再卡住（v0.8.3 修的）    4 条
            ② 六个新工具                    12 条
            ③ 变量跨分号（v0.8.2 修的）    2 条
            ④ 隔离用例：这些行为不该变      4 条
            ⑤ 控制流回归                   5 条
            ⑥ 故意试错：应给明确报错        2 条
            ```

            搜索框对清单也生效（能搜命令，也能搜期望结果）。
            这个分区**只读**：不落盘、不参与命令名补全、左滑没有编辑/删除。

            > 为什么要做这个：输入框是**单行**的，一次粘多行会被粘成一行、
            > mksh 直接报语法错。每版手测一轮成本高，还总漏项。
            > 现在清单跟着版本走，改完代码顺手加两条就行。

            ### 二、`id` 的选项不再糊成一整条

            ```
            id      → 候选是 -u  -g  -G  -n     （修好）
            id      → 候选是 -u|-g|-G|-n       （修之前，只有一根糊条）
            ```

            手册里写法是 `id [-u|-g|-G|-n]`，`|` 表示「这一位只能选其一」。
            补全原来只剥方括号不拆 `|`，整块被当成了**一个**叫 `-u|-g|-G|-n` 的选项——
            看得见、点不动，等于没有。补全链路由 `scripts/completion_selftest.ps1`
            的 `id ` → `-u -g -G -n` 用例守住。

            ### 三、`dirname` / `basename` 现在能补路径了

            ```
            dirname /et      → 补出 /etc/
            basename /et     → 补出 /etc/
            ```

            `PathCompletion` 的准入名单里压根没有这两个命令，
            所以打个斜杠一个候选都不出，看着像「候选条整体坏了」。
            这类漏网以前抓不住，因为**路径补全的准入名单从来没被任何测试碰过**——
            现在自检脚本会直接从源码里抠出名单，跟「哪些命令确实吃路径」对账，
            名字拼错（新加工具忘了登记）也会红。

            ### 顺带

            - 删掉 `CommandManual.sorted(byAlphabet:)` / `groups(byAlphabet:)`
              ——零调用的死代码。它们用 `Bool` 表达「按字母还是按功能」，
              和新的三态 `ViewMode` 打架，留着容易让下一个人改错地方。
            - 手册的分段逻辑补上 `ViewMode` 三态枚举，替换原来的 `Bool`。
              加第三个模式时 `Bool` 不够用，且 tag 类型一变，
              漏改的地方能编译通过、行为静默出错。
            - 自检 156 例全绿（危险命令 65 + 控制流 51 + 补全 40）。

            ## v0.8.3：`base64`、`cat`、`wc` 不再把 App 挂住

            ### 现象

            ```
            base64 hello          ← 不带文件名
            [TT] 正在执行……
            …然后就一直卡着，输入框不响应，候选补全条也不弹
            ```

            ### 根因

            `ProcessLauncher.spawnCapturing` 里，**没有管道输入时子进程直接继承 TT 自己的 stdin**。

            TT 是图形 App，它的 stdin 到底是什么 fd、平台说了算，说不好就是阻塞的。
            而 `base64` `xxd` `cat` `wc` `tee` `grep` 这些工具**不带文件参数时默认读 stdin**——
            ｜那就一直读、永远等不到 EOF，命令挂死。

            虽然外层有 60 秒超时兜底，但期间整个 App 停摆。

            ### 修法：没有管道输入就把 stdin 接到 /dev/null

            ```swift
            } else {
                posix_spawn_file_actions_addopen(&actions, STDIN_FILENO, "/dev/null", O_RDONLY, 0)
            }
            ```

            读操作**立刻返回 EOF**，行为等同于真 shell 里按 Ctrl-D。

            - 带文件参数的工具：从来不读 stdin，**完全不受影响**
            - 有管道输入时：照旧写临时文件、按原路径走，**不受影响**
            - mksh 的 `read`：以前会挂死，现在立刻返回 EOF

            ### 为什么这个 bug 容易被误判

            卡住时 App 停在「正在执行」，**输入框不响应、补全候选条也不弹**——
            外观看就像「补全功能坏了」。真机上就是这么被误报过一次。

            ### 测一下

            ```
            base64                 → 不再卡住（没东西可编，直接结束）
            cat                    → 不再卡住
            wc                     → 不再卡住
            grep x                 → 不再卡住

            带参数的照旧：
            cat /etc/hosts         → 正常
            wc -l /etc/hosts       → 正常
            echo hello | base64    → aGVsbG8K
            ```

            ## v0.8.2：`x=10; echo $x` 现在有用了

            ### 现象（真机实测）

            ```
            x=10; echo $((x*2)) 和 ${x} 和 ${#x}
            → 0 和  和 0
            ```

            ### 根因

            TT 的分段执行是**每段单独起一个 mksh 进程**。
            `;` 把上面这行切成两段：

            - 第 1 段：`x=10` 在一个 mksh 里赋值 → 进程退出，变量随之消失
            - 第 2 段：`echo $((x*2)) …` 在**另一个** mksh 里跑，`x` 是空的 → `0`

            **和 `cd` 一样**，都是「进程级状态跨不过分段」——只不过 `cd` 当初用应用层拦下来了，变量没有。

            ### 修法：给「需要整段」加第二种情形

            `ControlFlowDetector.needsWholeLine()` 现在覆盖两类：

            | 情形 | 为什么不能拆 |
            |---|---|
            | 控制流（`for`/`if`/`while`…） | `;` 会把 `for … done` 切烂 |
            | **变量赋值 + 后头还有段** | 赋值死在第一个进程里 |

            ```
            ┌─ needsWholeLine？──是──→ mksh -c '整行'   （状态保得住）
                       │
                       否
                       ↓
                 按 ; | && || 正常分段
            ```

            **注意故意不加 `cd`**：TT 要拦下 `cd` 才能跨命令保持目录，
            那条继续走分段——代价是 `x=5; cd /tmp` 这种混写不保变量。

            ### 判定细节

            - 只在**顶层有分隔符**时才判赋值。`x=10` 孤零零一条本来就没分段，
              走哪条路都一样，不必改道。
            - 引号里的不算：`echo "x=10; echo $x"` 不会被误判。
            - `echo a=1` 里那个 `a=1` 也**不**算赋值（无分隔符），继续走分段。

            ### 自检从 34 例加到 51 例

            `scripts/controlflow_selftest.ps1` 新增 17 条赋值用例，
            三套自检现在合计 **149 例**（51 + 33 + 65）。

            ### 测一下

            ```
            x=10; echo $((x*2)) 和 ${x} 和 ${#x}    → 20 和 10 和 2
            x=1; y=2; echo $x$y                   → 12
            n=3 && echo 有 $n                      → 有 3
            i=0; for x in {1..3}; do echo $i$x; done
            ```

            别忘了**隔离用例**仍然走分段（这些行为不该变）：
            ```
            x=10                                      → 没有输出，正常
            cd /tmp && pwd                            → /tmp，且下次敲 pwd 还在 /tmp
            echo abc | wc                             → 1 1 4
            ls -l /etc                                → 正常列目录
            ```

            ## v0.8.1：修「所有命令被 9 终止」

            ### 现象

            ```
            [TT] 命令被 *9 终止，退出码 137
            ```

            **所有**ttbin 命令都这样，跟 v0.8.0 新加的那 6 个没关系——
            实际上 v0.6.0 加的 `seq` `tee` `nl` 也一样。

            ### 真凶：嵌套二进制漏签名

            TrollStore 装的 App 里，`ttbin/` 下每个二进制都必须**单独带 entitlements 签名**。
            没签的会被内核的 AMFI 直接 **SIGKILL**——所以是信号 9 / 退出码 137，
            **C 代码完全没问题，编译也完全没问题**。

            漏在哪：`scripts/build-mksh.sh` 里有一份**手写的签名清单**，
            我 v0.8.0 加工具时只改了 `build.yml` 的编译列表，忘了改它。

            ```
            build.yml 的编译列表     → 已加 6 个 ✓
            build-mksh.sh 的签名列表 → 没加 ✗   ← 真凶
            ```

            而且 `seq` `tee` `nl` 是 v0.6.0 加的，同样漏了——
            这事**已经发生过两次**，都是同一个坑。

            ### 修法：两份清单合成一份

            两份清单分处两个文件，加一个工具要改两处，**必然会忘**。

            现在 `build-mksh.sh` **自动扫 `TT/ttbin/`**，扫到什么签什么。
            编译清单仍然是唯一需要维护的地方。

            ### 再加一道硬闸

            打包那步现在会**逐个检查** ttbin 里每个二进制都带 `no-sandbox`，
            缺一个就直接让构建失败：

            ```
            ::error::嵌套二进制未签名或缺 entitlements，装到手机上会被 SIGKILL: ...
            ```

            宁可构建红，也不发一个「装得上但一用就死」的包。
            顺带把原来只抽查 10 个的 `test -s` 换成了全量检查，
            构建日志会打印 `ttbin 签名自检通过（33 个）`。

