name: TT 编译与发布

on:
  push:
    branches: [main, "v*"]
  workflow_dispatch:

concurrency:
  group: tt-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  # 单一版本来源：IPA 文件名、tag、产物名、Info.plist 校验全部引用这里。
  # 升版本只改这一行；分支用 v* 通配，不必再往 branches 里补版本号。
  VERSION: "0.4.8"

jobs:
  build:
    name: 编译 iOS 安装包
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: 获取项目源码
        uses: actions/checkout@v4

      - name: 检查苹果编译环境
        run: |
          xcode-select -p
          xcodebuild -version

      - name: 安装项目生成工具
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          fi
          xcodegen --version

      - name: 生成 TT 应用图标
        run: swift scripts/generate_icon.swift

      - name: 编译容器内探针程序 ttprobe
        run: |
          set -euo pipefail
          SYSROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun -sdk iphoneos clang -arch arm64 -isysroot "$SYSROOT" -O2 -o scripts/ttprobe scripts/ttprobe.c
          file scripts/ttprobe
          test -s scripts/ttprobe

      - name: 构建内置命令工具 ttbin
        run: |
          set -euo pipefail
          SYSROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          mkdir -p TT/ttbin
          for t in ls cat date whoami uname df wc head tail grep \
                   touch mkdir rm cp mv sort uniq cut tr du stat find; do
            xcrun -sdk iphoneos clang -arch arm64 -isysroot "$SYSROOT" -O2 -o "TT/ttbin/$t" "scripts/tttools/tt${t}.c"
          done
          xcrun -sdk iphoneos clang -arch arm64 -isysroot "$SYSROOT" -O2 -o TT/ttbin/ttfork scripts/tttools/ttfork.c
          file TT/ttbin/*

      - name: 构建内置 Shell mksh 并签名嵌套二进制
        run: bash scripts/build-mksh.sh

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 编译 iPhone 应用
        run: |
          set -euo pipefail
          xcodebuild \
            -project TT.xcodeproj \
            -scheme TT \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: 打包 IPA 安装包
        run: |
          set -euo pipefail
          APP="build/DerivedData/Build/Products/Release-iphoneos/TT.app"
          test -d "$APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist" | grep -Fx 'com.daofeidao.tt'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist" | grep -Fx "$VERSION"
          test -s "$APP/ttprobe"
          test -s "$APP/ttbin/mksh"
          for t in ls cat date whoami uname df wc head tail grep ttfork; do test -s "$APP/ttbin/$t"; done
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/TT.app
          /usr/bin/codesign --force --deep --sign - --entitlements tt.entitlements build/ipa/Payload/TT.app
          cd build/ipa
          /usr/bin/zip -qry "../TT-v$VERSION.ipa" Payload
          cd ../..
          test -s "build/TT-v$VERSION.ipa"
          echo "IPA 安装包已生成："
          ls -lh "build/TT-v$VERSION.ipa"
          /usr/bin/unzip -l "build/TT-v$VERSION.ipa" | head -40

      - name: 发布并上传 IPA
        if: github.ref == 'refs/heads/v0.4.8-nowaterfall' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: TT v${{ env.VERSION }}（仅去掉 10ms 瀑布流）
          body: |
            ## v0.4.8：只做一件事——去掉 10ms 瀑布流

            基线是 **v0.4.7**，本版**只改一处**，其余一律不动。

            ### 改了什么

            启动自检从「每 10ms 追加一行」改成**一次性输出**完整报告。

            ```
            - 每加一行 → 重建整份富文本 + 触发布局测量 + 滚动一次
            - 每秒 100 次这种主线程循环
            + 真机上直接把 App 压死
            ```

            末尾仍保留绿色结论行 `[TT] 启动自检完成 · N 行`，
            输出落定后 0.35 秒自动弹键盘。

            ### 没改什么（本版一律保留 v0.4.7 原样）

            - 自检配色分层（标签名亮、取值暗）
            - 危险命令拦截（当前是**输密码放行**版）
            - 命令清单的分类筛选 / 编辑 / 自定义
            - 彩色显示、长按选择、复制、输入历史
            - 23 个内置命令 + mksh

            **没有**自动补全、**没有**扩展键盘——那两项会各自成为单独的版本，
            到时候会先问你。

            ### 验收

            ```
            1. 启动 App → 必须流畅，不卡死
            2. 自检报告一次性出现，末尾有绿色结论行
            3. 约 0.35 秒后键盘自动弹出
            4. ls → df → echo abc | wc → cd bin && pwd  各跑一条
            5. 打开命令清单，左滑编辑/删除
            6. rm -rf / → 应弹出密码确认（当前版本是确认放行，不是硬拦截）
            ```

            **验收状态：** 编译 ⏳、IPA ⏳、**真机待复验**。
          files: build/TT-v${{ env.VERSION }}.ipa
          fail_on_unmatched_files: true
          make_latest: true

      - name: 上传备用编译产物
        uses: actions/upload-artifact@v4
        with:
          name: TT-v${{ env.VERSION }}-测试版-IPA
          path: build/TT-v${{ env.VERSION }}.ipa
          if-no-files-found: error
          retention-days: 14
