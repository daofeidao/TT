name: TT 编译与发布

on:
  push:
    branches: [main, "v0.3.0-*", "v0.3.1-*", "v0.3.2-*", "v0.3.4-*", "v0.3.5-*"]
  workflow_dispatch:

concurrency:
  group: tt-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: 编译 iOS 安装包
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: 获取项目源码
        uses: actions/checkout@v4

      - name: 检查苹果编译环境
        run: |
          xcode-select -p
          xcodebuild -version

      - name: 安装项目生成工具
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          fi
          xcodegen --version

      - name: 生成 TT 应用图标
        run: swift scripts/generate_icon.swift

      - name: 编译容器内探针程序 ttprobe
        run: |
          set -euo pipefail
          SYSROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun -sdk iphoneos clang -arch arm64 -isysroot "$SYSROOT" -O2 -o scripts/ttprobe scripts/ttprobe.c
          file scripts/ttprobe
          test -s scripts/ttprobe

      - name: 构建内置命令工具 ttbin
        run: |
          set -euo pipefail
          SYSROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          mkdir -p TT/ttbin
          for t in ls cat date whoami uname df wc head tail grep ttfork; do
            xcrun -sdk iphoneos clang -arch arm64 -isysroot "$SYSROOT" -O2 -o "TT/ttbin/$t" "scripts/tttools/tt${t}.c"
          done
          file TT/ttbin/*

      - name: 构建内置 Shell mksh 并签名嵌套二进制
        run: bash scripts/build-mksh.sh

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 编译 iPhone 应用
        run: |
          set -euo pipefail
          xcodebuild \
            -project TT.xcodeproj \
            -scheme TT \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: 打包 IPA 安装包
        run: |
          set -euo pipefail
          APP="build/DerivedData/Build/Products/Release-iphoneos/TT.app"
          test -d "$APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist" | grep -Fx 'com.daofeidao.tt'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist" | grep -Fx '0.3.5'
          test -s "$APP/ttprobe"
          test -s "$APP/ttbin/mksh"
          for t in ls cat date whoami uname df wc head tail grep ttfork; do test -s "$APP/ttbin/$t"; done
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/TT.app
          /usr/bin/codesign --force --deep --sign - --entitlements tt.entitlements build/ipa/Payload/TT.app
          cd build/ipa
          /usr/bin/zip -qry ../TT-v0.3.5.ipa Payload
          cd ../..
          test -s build/TT-v0.3.5.ipa
          echo "IPA 安装包已生成："
          ls -lh build/TT-v0.3.5.ipa
          /usr/bin/unzip -l build/TT-v0.3.5.ipa | head -40

      - name: 发布 v0.3.5 并上传 IPA
        if: github.ref == 'refs/heads/v0.3.5-fork-probe' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.5
          name: TT v0.3.5（fork 探针与管道工具集）
          body: |
            ## v0.3.5：SIGBUS 根因探针 + 管道工具集

            ### v0.3.4 真机结果

            | 测试 | 结果 |
            |---|---|
            | `cd bin && ls` | 已修复，输出 df / ps |
            | `ls -l` | 长格式生效（权限位/大小/时间）|
            | `echo abc \| wc` | 管道数据流通了，但报 `wc: inaccessible or not found`（127）——缺工具 |

            ### 本版改动

            1. **fork 能力探针（ttfork）**：新增诊断二进制，分别以「纯 fork+_exit」和「fork+exec」两轮循环各执行 8 次，**精确报告第几次进程创建崩溃**。启动自检会自动运行并打印完整结果。
            2. **补齐管道常用工具**：`wc`（-l/-w/-c）、`head`、`tail`（-n）、`grep`（-v），管道两端不再缺工具。
            3. 权限与嵌套二进制签名机制保持不变。

            ### 这次要查明的问题

            mksh 单条命令正常、`ls`/`date` 等外部命令正常，但连续两次进程创建就 SIGBUS（138）。
            ttfork 会告诉我们这是「fork 机制被限制」还是「存在 fork 次数预算」，以及 exec 是否是崩溃点——
            这决定后续方向：修 mksh 的 fork 路径，还是换用更轻的 shell。

            ### 建议测试

            启动后先看自检里的「fork 探针」整段输出（把 TT_FORK_BEGIN 到 TT_FORK_END 之间的内容发我），
            然后测：`echo abc | wc` → `ls /etc | head -5` → `ls /bin | grep df` → `echo a; echo b`。

            **验收状态：** 编译、IPA 就绪；真机执行待验证。
          files: build/TT-v0.3.5.ipa
          fail_on_unmatched_files: true
          make_latest: true

      - name: 上传备用编译产物
        uses: actions/upload-artifact@v4
        with:
          name: TT-v0.3.5-测试版-IPA
          path: build/TT-v0.3.5.ipa
          if-no-files-found: error
          retention-days: 14