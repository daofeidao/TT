            所以把 v0.5.4 合进来重出一版，编号 0.6.1。
            **附件栏就是你刚说「看着完美」的那一版，一行没动。**

            ### 主线：权限检测报告

            「关于 TT」里，「启动自检报告」下面多一个 **「权限检测报告」**，
            点进去右上角「开始检测」，检测完左上角 **「复制全部」**，一键把整份报告复制走。

            目的是把「这台机器上 TT 到底能碰到什么」一次性测清楚，不靠猜。报告包含：

            | 段落 | 内容 |
            |---|---|
            | 身份 | uid / euid / gid / 用户名 / 组名，是否 root |
            | 目录读写实测 | 18 个关键路径逐一测 **读 / 写 / 执行** |
            | 写得动的地方 | 把上面可写的单独拎出来——这几条才是要盯的 |
            | 越狱痕迹 | `/var/jb`、`/bin/bash`、`/etc/apt` 等 10 项 |
            | 系统可执行文件 | 扫 `/bin` `/usr/bin` `/sbin` `/usr/sbin` `/usr/libexec` |
            | 进程创建能力 | posix_spawn、mksh 执行外部命令、fork 探针 |
            | PATH / 设备 | 路径、机型、磁盘余量 |

            **写测试是真的建文件**：用唯一命名的临时文件，建完立刻删掉，只删自己刚建的那一个。
            这是唯一能真正测出写权限的办法——`access(W_OK)` 会骗人，
            它不看 ACL 也不看 entitlement 的实际效果。

            检测放后台线程，**不塞进启动自检**（那个要快、要无副作用）。

            **跑完把报告发我**——下一版往哪使劲，全看这份报告的结果。

