name: TT 编译与发布

on:
  push:
    branches: [main, "v*"]
  workflow_dispatch:

concurrency:
  group: tt-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  # 单一版本来源：IPA 文件名、tag、产物名、Info.plist 校验全部引用这里。
  # 升版本只改这一行；分支用 v* 通配，不必再往 branches 里补版本号。
  VERSION: "0.4.9"

jobs:
  build:
    name: 编译 iOS 安装包
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: 获取项目源码
        uses: actions/checkout@v4

      - name: 检查苹果编译环境
        run: |
          xcode-select -p
          xcodebuild -version

      - name: 安装项目生成工具
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          fi
          xcodegen --version

      - name: 生成 TT 应用图标
        run: swift scripts/generate_icon.swift

      - name: 编译容器内探针程序 ttprobe
        run: |
          set -euo pipefail
          SYSROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun -sdk iphoneos clang -arch arm64 -isysroot "$SYSROOT" -O2 -o scripts/ttprobe scripts/ttprobe.c
          file scripts/ttprobe
          test -s scripts/ttprobe

      - name: 构建内置命令工具 ttbin
        run: |
          set -euo pipefail
          SYSROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          mkdir -p TT/ttbin
          for t in ls cat date whoami uname df wc head tail grep \
                   touch mkdir rm cp mv sort uniq cut tr du stat find; do
            xcrun -sdk iphoneos clang -arch arm64 -isysroot "$SYSROOT" -O2 -o "TT/ttbin/$t" "scripts/tttools/tt${t}.c"
          done
          xcrun -sdk iphoneos clang -arch arm64 -isysroot "$SYSROOT" -O2 -o TT/ttbin/ttfork scripts/tttools/ttfork.c
          file TT/ttbin/*

      - name: 构建内置 Shell mksh 并签名嵌套二进制
        run: bash scripts/build-mksh.sh

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 编译 iPhone 应用
        run: |
          set -euo pipefail
          xcodebuild \
            -project TT.xcodeproj \
            -scheme TT \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: 打包 IPA 安装包
        run: |
          set -euo pipefail
          APP="build/DerivedData/Build/Products/Release-iphoneos/TT.app"
          test -d "$APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist" | grep -Fx 'com.daofeidao.tt'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist" | grep -Fx "$VERSION"
          test -s "$APP/ttprobe"
          test -s "$APP/ttbin/mksh"
          for t in ls cat date whoami uname df wc head tail grep ttfork; do test -s "$APP/ttbin/$t"; done
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/TT.app
          /usr/bin/codesign --force --deep --sign - --entitlements tt.entitlements build/ipa/Payload/TT.app
          cd build/ipa
          /usr/bin/zip -qry "../TT-v$VERSION.ipa" Payload
          cd ../..
          test -s "build/TT-v$VERSION.ipa"
          echo "IPA 安装包已生成："
          ls -lh "build/TT-v$VERSION.ipa"
          /usr/bin/unzip -l "build/TT-v$VERSION.ipa" | head -40

      - name: 发布并上传 IPA
        if: github.ref == 'refs/heads/v0.4.9-autocomplete' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: TT v${{ env.VERSION }}（命令自动补全）
          body: |
            ## v0.4.9：命令自动补全

            基线 **v0.4.8**，本版**只加这一个功能**，其余一律不动。

            ### 做什么

            输入命令时，输入框正上方出现一排候选卡片，每张两行：
            **命令名 + 完整用法**。边打字边出，长命令和记不住的选项不用背。

            | 行为 | 说明 |
            |---|---|
            | 前缀匹配优先 | `so` → `sort` |
            | 补充「包含」匹配 | 只记得中间几个字母也搜得到 |
            | 点一下（没打全） | **补成命令名** |
            | 点一下（已经打全） | **把完整用法填进去**，该卡片此时高亮描边 |
            | 出现时机 | 只在**命令名那一段** |
            | 自动隐藏 | 敲到第二个词（管道、参数、路径）、清空输入 |
            | 数量 | 最多 12 条，横向滚动 |

            例：输入 `so` → 出现 `sort`；再点一次 → 填入
            `sort [-n] [-r] [-u] [文件]`。

            高亮的作用是提示「这条已经打全了，再点会给模板而不是重复补全」。

            ### 为什么在敲第二个词时就收起

            写管道、重定向、路径时（`cat `、`echo x > `）命令名已经定了，
            这时候继续弹候选纯属碍事，也容易误触改变输入内容。

            ### 没动的部分（v0.4.8 原样）

            - 自检一次性输出、无瀑布流
            - 自检配色分层（标签名亮、取值暗）
            - 危险命令拦截（仍是**输密码放行**版）
            - 命令清单的分类筛选 / 编辑 / 自定义
            - 彩色显示、长按选择、复制、输入历史
            - 23 个内置命令 + mksh

            **没有**扩展键盘——它要动核心输入链路，会单独成为一版。

            ### 验收

            ```
            1. 启动 App → 流畅，自检一次性输出
            2. 点输入框，输入 so
               → 应出现 sort 候选
            3. 点 sort → 输入框变成 "sort"
            4. 再点 sort（此时卡片高亮）
               → 应填入 "sort [-n] [-r] [-u] [文件]"
            5. 输入 pu → 应出现 pwd（包含匹配）
            6. 输入 "cat "（带空格）→ 候选应消失
            7. 清空输入 → 候选应消失
            8. 输入 ls 后发送 → 应正常执行
            ```

            **验收状态：** 编译 ⏳、IPA ⏳、**真机待复验**。
          files: build/TT-v${{ env.VERSION }}.ipa
          fail_on_unmatched_files: true
          make_latest: true

      - name: 上传备用编译产物
        uses: actions/upload-artifact@v4
        with:
          name: TT-v${{ env.VERSION }}-测试版-IPA
          path: build/TT-v${{ env.VERSION }}.ipa
          if-no-files-found: error
          retention-days: 14
