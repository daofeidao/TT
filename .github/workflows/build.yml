name: TT 编译与发布

on:
  push:
    branches: [main, "v*"]
  workflow_dispatch:

concurrency:
  group: tt-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  # 单一版本来源：IPA 文件名、tag、产物名、Info.plist 校验全部引用这里。
  # 升版本只改这一行；分支用 v* 通配，不必再往 branches 里补版本号。
  VERSION: "0.4.1"

jobs:
  build:
    name: 编译 iOS 安装包
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: 获取项目源码
        uses: actions/checkout@v4

      - name: 检查苹果编译环境
        run: |
          xcode-select -p
          xcodebuild -version

      - name: 安装项目生成工具
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          fi
          xcodegen --version

      - name: 生成 TT 应用图标
        run: swift scripts/generate_icon.swift

      - name: 编译容器内探针程序 ttprobe
        run: |
          set -euo pipefail
          SYSROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun -sdk iphoneos clang -arch arm64 -isysroot "$SYSROOT" -O2 -o scripts/ttprobe scripts/ttprobe.c
          file scripts/ttprobe
          test -s scripts/ttprobe

      - name: 构建内置命令工具 ttbin
        run: |
          set -euo pipefail
          SYSROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          mkdir -p TT/ttbin
          for t in ls cat date whoami uname df wc head tail grep \
                   touch mkdir rm cp mv sort uniq cut tr du stat find; do
            xcrun -sdk iphoneos clang -arch arm64 -isysroot "$SYSROOT" -O2 -o "TT/ttbin/$t" "scripts/tttools/tt${t}.c"
          done
          xcrun -sdk iphoneos clang -arch arm64 -isysroot "$SYSROOT" -O2 -o TT/ttbin/ttfork scripts/tttools/ttfork.c
          file TT/ttbin/*

      - name: 构建内置 Shell mksh 并签名嵌套二进制
        run: bash scripts/build-mksh.sh

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 编译 iPhone 应用
        run: |
          set -euo pipefail
          xcodebuild \
            -project TT.xcodeproj \
            -scheme TT \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: 打包 IPA 安装包
        run: |
          set -euo pipefail
          APP="build/DerivedData/Build/Products/Release-iphoneos/TT.app"
          test -d "$APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist" | grep -Fx 'com.daofeidao.tt'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist" | grep -Fx "$VERSION"
          test -s "$APP/ttprobe"
          test -s "$APP/ttbin/mksh"
          for t in ls cat date whoami uname df wc head tail grep ttfork; do test -s "$APP/ttbin/$t"; done
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/TT.app
          /usr/bin/codesign --force --deep --sign - --entitlements tt.entitlements build/ipa/Payload/TT.app
          cd build/ipa
          /usr/bin/zip -qry "../TT-v$VERSION.ipa" Payload
          cd ../..
          test -s "build/TT-v$VERSION.ipa"
          echo "IPA 安装包已生成："
          ls -lh "build/TT-v$VERSION.ipa"
          /usr/bin/unzip -l "build/TT-v$VERSION.ipa" | head -40

      - name: 发布并上传 IPA
        if: github.ref == 'refs/heads/v0.4.1-tools-checklist' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: TT v${{ env.VERSION }}（内置命令补全 + 清单可编辑）
          body: |
            ## v0.4.1：内置命令补全 + 清单分类/编辑/自定义

            ### 1. 内置命令补全（新增 12 个）

            上一版内置 11 个命令，管道里常见的一大半都会报"command not found"。这版补齐。

            | 类别 | 新增命令 | 支持选项 |
            |---|---|---|
            | 文件操作 | `touch` `mkdir` `rm` `cp` `mv` | `-p` / `-r` / `-f` |
            | 文本管道 | `sort` `uniq` `cut` `tr` | `-n -r -u` / `-c` / `-d -f -c` / `-d` |
            | 信息查询 | `du` `stat` `find` | `-s -h` / `-name -type` |

            连同原有的 `ls cat date whoami uname df wc head tail grep`，
            内置命令共 23 个，外加 mksh 自带的 `echo pwd cd true false test [ ] sleep`。

            ```bash
            echo -e "3\n1\n2" | sort -n          # 数值排序
            echo -e "a\na\nb" | uniq -c           # 带计数去重
            cat /etc/hosts | cut -d' ' -f1        # 按分隔符取列
            echo hello | tr a-z A-Z               # 字符映射
            mkdir -p /tmp/ttd && touch /tmp/ttd/f # 建目录建文件
            find /tmp -name 'tt*' -type f         # 查找
            du -sh /tmp                           # 目录占用
            stat /tmp/ttd/f                       # 文件元信息
            ```

            ### 2. 命令清单：分类 + 排序

            - 清单按**分类分节**展示，不再是拉平的长列表。
            - 顶部新增分类筛选条：全部 / 基础 / 状态码 / 组合 / 重定向 / 文件 / 目录，点一下只看该类。
            - 新增"文件"分组 10 条（touch / mkdir / cp / mv / stat / rm / find / du）。

            ### 3. 命令清单：编辑 + 自定义

            - 工具栏 **⋯ → 添加命令**：填命令、分类、期望结果即可新增，自定义条目带蓝色标签。
            - 工具栏 **编辑**：进入编辑模式后点任意一条即可修改，**左滑删除**。
            - 分类输入框下方有已有分类的快捷胶囊，点一下就填上，不用手打。
            - 所有改动**存到本机**（UserDefaults），下次打开还在。
            - 工具栏 **⋯ → 恢复默认清单**：一键还原内置清单。

            ### 兼容性

            清单改为可写结构体后存进 UserDefaults；若你从 v0.4.0 升级，
            首次打开会用新默认值重建清单（旧清单不迁移）。
            终端主体、彩色显示、长按选择、复制、输入历史均未改动。

            **验收状态：** 编译 ⏳、IPA ⏳、真机执行 ⏳ 待验证。
          files: build/TT-v${{ env.VERSION }}.ipa
          fail_on_unmatched_files: true
          make_latest: true

      - name: 上传备用编译产物
        uses: actions/upload-artifact@v4
        with:
          name: TT-v${{ env.VERSION }}-测试版-IPA
          path: build/TT-v${{ env.VERSION }}.ipa
          if-no-files-found: error
          retention-days: 14