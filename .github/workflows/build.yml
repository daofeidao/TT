            ## v0.4.19：补全改成显式状态 + 程序自己报候选

            ### 背景：这条查了四版，四版都是靠读代码推断，推错了三次

            | 版本 | 改了什么 | 真机结果 |
            |---|---|---|
            | v0.4.11 | 点命令名补横杠 | 没出来 |
            | v0.4.14 | 改成补空格，选项与路径混排 | 没出来 |
            | v0.4.17 | `parsedInput` 绕开 split 的尾部空段歧义 | 没出来 |
            | v0.4.18 | `Completion.id` 稳定化 | 没出来 |

            四次都改在了「推断出的那个点上」，而**真机上到底算出了什么，从来没有被观测过**——
            连 `ttdebug` 都是坏的：它跑在 `command = ""` 之后，打出来是 `command=[]`，
            等于什么都没查。这一版停止推断。

            ### 1. 候选不再在 body 里现算，改成显式状态

            ```swift
            @State private var optionCompletions: [Completion] = []
            private var visibleCompletions: [Completion] {
                optionCompletions + pathCompletions    // 选项在前，路径在后
            }
            ```

            由 `onChange(of: command)` 算好写进来。这样「**算出来了但没显示**」
            和「**压根没算出来**」立刻能分开——前者是渲染问题，后者是解析问题，
            两者要查的方向完全不同，之前一直混在一起猜。

            ### 2. 程序自己开口：算出选项就往终端写一行

            输入变成「命令名 + 空格」且算出了选项时，自动往终端打：

            ```
            [TT] 候选自检：[ls ] → 算出 2 个选项：-l -a
            ```

            **用户什么都不用做**，随便发一条命令，答案就在屏幕上。

            ### 怎么读结果

            - 屏幕**出现**这行、但候选条还是没有 `-l` `-a`
              → 计算是对的、渲染把它吃了，问题在 SwiftUI 那一层
            - 屏幕**没有**这行
              → 计算就没算出来，问题在解析或数据源那一层

            ### 3. ttdebug 补上「渲染用的是什么」

            诊断末尾多两行，直接对上渲染时真正用的那份数据：

            ```
            最近一次自动自检：
              [TT] 候选自检：[ls ] → 算出 2 个选项：-l -a
            渲染用 optionCompletions=[-l, -a]
            渲染用 pathCompletions=12 条
            ```

            ### 验收

            ```
            1. ls + 空格   → 终端应出现「候选自检：[ls ] → 算出 2 个选项：-l -a」
                            候选条里 -l  -a  应排在路径前面
            2. mkdir + 空格 → 候选自检应报 -p
            3. sort + 空格  → 应报 -n  -r  -u
            4. head + 空格  → 应报 -n
            5. cat + 空格   → cat 没有选项，不应出现自检行（这是对的）
            6. 把终端里那几行截图发我 —— 有它就能定位，不用再猜
            ```

            ## v0.4.18：候选卡片 id 稳定化 + 诊断改为可查任意一行

            ### 真机反馈：`ls ` 之后仍然不出 `-l` `-a`（第三版）

            v0.4.17 把解析逻辑改对了（判定表 26/26，且不依赖 split 的尾部空段行为），
            真机上仍然只出路径。同时 `ttdebug` 打出来是：

            ```
            command=[] 字符数=0
            末尾是空格=false
            已完成的词 words=[[]]
            ```

            **`command=[]`** —— 诊断跑在 `command = ""` **之后**，
            报告的是空字符串。上一版的诊断等于没查，用户白跑一趟。

            ### 1. 候选卡片的 id 每次渲染都在换（主嫌疑）

            ```swift
            private struct Completion: Identifiable {
                let id = UUID()     // ← 问题
            ```

            `completions` 是**计算属性**，每算一次就重新构造一批 `Completion`；
            而 `visibleCompletions` 在 body 里还被访问了**两次**
            （`if !visibleCompletions.isEmpty` 一次、`ForEach(visibleCompletions)` 一次）。
            于是每次重渲染，同一批候选卡片都拿到一批**全新的 UUID**，
            SwiftUI 会把横向 `ScrollView` 里的每一行拆掉重建，滚动位置跟着乱跳——
            选项卡片可能来不及显示就又被换掉了。

            改成 `var id: String { "\(kind.rawValue):\(title)" }`：
            同一批候选每次算出来完全一致，行才认得出来。
            顺带把 `visibleCompletions` 收进 `let items`，整个列表只算一遍。

            ### 2. 诊断改成可以查任意一行

            - `ttdebug` **接在命令后面一起发**：`ls ttdebug`、`mkdir ttdebug`
              → 诊断去掉 `ttdebug` 后剩的那一行，不受输入框快照影响
            - 单独发 `ttdebug` → 诊断最近一次有内容的输入（快照）
            - 两种写法都**不清空输入框**，可以连着试
            - 诊断不再走危险检查，也不再依赖输入框的当前状态

            ### 怎么验的

            ```
            1. ls + 空格        → 应出现 -l  -a  和路径（选项在前）
            2. mkdir + 空格     → -p
            3. head + 空格      → -n
            4. sort + 空格      → -n  -r  -u
            5. ls -l + 空格 → 点 -a → ls -l -a
            6. 仍然不对的话：输入 "ls ttdebug" 直接发送
                              → 会打出 诊断对象=[ls ] 已完成的词 words=[ls]
                                正在写的 token=[] 空=true
                                optionList=[-l, -a]
                                命令/选项候选数=2
            ```

            **怎么读第 6 条的输出**：
            - 候选数是 2 但界面不显示 → 渲染层还有问题
            - 候选数是 0 → 解析层还有问题，把上面几行发我

            ## v0.4.17：选项补全重做 + 手册同名条目分开

            ### 1. `ls ` 之后不出 `-l` `-a`（连挂两版，这次找到真因）

            之前靠 `command.split(separator: " ", omittingEmptySubsequences: false)`
            拿"尾部空段"来判断用户是不是刚打完一个词。但 `"ls "` 到底分出
            `["ls", ""]` 还是 `["ls"]`，一旦行为和预期不符，
            "刚打完命令名 → 该补选项"这条分支就永远进不去。
            本机没有 Swift 编译器验证不了那个行为，就一直在纸面上推，推了两次都"应该对"。

            **这次改成自己算当前 token**（`parsedInput`）：末尾有没有空格，
            决定最后一段算**已完成的词**还是一个**刚开始写的空段**。
            完全不依赖 split 对尾部空段的处理。

            | 输入 | 已完成的词 | 正在写的 token | 结果 |
            |---|---|---|---|
            | `l` | — | `l` | 补命令名 |
            | `ls ` | `ls` | 空 | **补选项 + 补路径** |
            | `ls -` | `ls` | `-` | 补选项 |
            | `ls -l ` | `ls` `-l` | 空 | 补选项（可叠第二个）+ 补路径 |
            | `ls /et` | `ls` | `/et` | 补路径 |

            判定表已用 PowerShell 移植验证：**26/26 通过，且在 split 保留/丢弃尾部空段
            两种行为下结果完全一致**——说明那个歧义真的绕开了，不是碰巧对。

            顺带修：前导空格会让命令名对不上手册，现在空段一律滤掉。

            ### 2. 手册里 `ls` 和 `ls -la` 显示成同一个名字

            `displayName` 只取了第一行的**第一个词**，于是 `ls` 和 `ls -la`
            在列表里显示一模一样，点下去跑的却完全是两回事——
            等于把「命令名」和「真实命令」当成了同一件事。

            **一行现在就是一条完整命令**，`ls` 与 `ls -la` 自然分得开。
            另外给条目加来源标签：

            - **测试** —— 从旧测试清单迁移来的条目
              （不管命令名是否撞上内置条目，`ls`、`df` 都会撞，必须一眼分清）
            - **脚本·逐行** / **脚本·整段** —— 脚本条目
            - **自定义** —— 手动新增的

            旧测试条目沿用手册的用法说明、和它下面的"备注"重复，那一行已隐藏。

            ### 怎么验的

            ```
            1. 输入 "ls" 加空格   → 候选里应同时出现 -l  -a  和路径（选项在前）
            2. 输入 "mkdir" 加空格 → 应出现 -p
            3. 输入 "head" 加空格  → 应出现 -n
            4. 输入 "sort" 加空格  → 应出现 -n  -r  -u
            5. 输入 "ls -l" 加空格 → 再点 -a 应得到 "ls -l -a"
            6. 手册里找 ls 和 ls -la → 应显示成两个不同的条目，旧的带「测试」标签
            7. "cat" 加空格        → 不应出现选项（cat 确实没有选项），只出路径
