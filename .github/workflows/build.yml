            ## v0.5.1：修输入行被撑开 + 精简符号页 + 括号自动配对


            ### 1. 输入行上下空出一大截（v0.5.0 的真 bug）

            ```
            ┌──────────────────────────────┐
            │ [终端输出……]                 │
            │                              │
            │                              │  ← 本该没有的两大块空白
            │  ›  输入命令……          📋 ↑ │
            ├──────────────────────────────┤
            │ esc ↑ ↓ ← → ⌫ ^C            │  ← 附件栏
            └──────────────────────────────┘
            ```

            **原因**：`TerminalTextField` 是 `UIViewRepresentable`，
            `UITextField` 报给 SwiftUI 的固有高度不合适，放进 `HStack` 里**被纵向撑开**，
            于是输入行那整条 HStack 变成一大块，`›` 和发送箭头被顶到中间。

            **修法**：显式 `.frame(height: 34)`。
            （`sizeThatFits(_:uiView:context:)` 是 iOS 16 才有的，部署目标是 15，用不了。）

            ### 2. 符号页精简成一行

            `||` `&&` `>>` `2>&1` `~/` `../` 这些组合符号**全删了**——
            组合符号按两下就能打出来，专门给它一个键不值当，
            **附件栏的位置比符号数量值钱**。现在全是单个字符，一行：

            ```
            |  &  /  >  <  ;  ~  -  _  .  =  *  ?  '  "  $  #  %  !  @  [  ]  (  )
            ```

            控制行：`esc ↑ ↓ ← → ⌫ ^C`（7 个，不加 ctrl）

            ### 3. 括号引号自动配对（常开，没有开关）

            | 输入 | 结果 |
            |---|---|
            | `(` | 变成 `()`，光标停在中间 |
            | `[` | 变成 `[]`，光标停在中间 |
            | `"` | 变成 `""`，光标停在中间 |
            | 选中一段文字再按 `(` | 被 `(…)` 包起来 |
            | 在 `(` 后面再按一次 `(` | **光标跳过去**，不重复插 |

            附件栏上的键和系统键盘的键**行为一致**——
            两条路径都做了配对，`(` `( )` `'` `"` 这类在系统键盘的 123 层里也有，
            只做一边会出现"同一个括号有时配有时不配"。

            ### 验收

            ```
            1. 键盘弹起时，输入行紧贴在附件栏上方，**上下不再有空白**
            2. 终端输出区和输入行的高度恢复正常
            3. esc ↑ ↓ ← → ⌫ ^C 七个键都在
            4. 点 › 展开符号页，只有**一行**，可以横向滑动
            5. 符号页里没有 || && >> ~/ 之类的组合符号
            6. 打 ( → 出现 ()，光标在中间
            7. 在中间打内容 → 内容在括号里
            8. 再打一次 ( → 光标跳到 ) 后面，不多打一个
            9. 选中一段文字按 ( → 被包起来
            10. 系统键盘 123 层里打 ( → 同样配对
            11. ls + 空格 → 候选里 -l  -a  在前，路径在后
            12. ↑↓ 翻历史、←→ 移动光标、esc 清行、^C 杀进程都正常
            13. rm -rf / 仍弹「已拦截，不会执行」
            14. 终端里长按选择、复制菜单照常
            ```

            ## v0.5.0：扩展键盘

            iOS 系统键盘打不了 `|` `>` `~` `*` `;`，`esc` `^C` 完全没有，`&&` `2>&1` 要按四下。
            这一版补上。

            ### 放在系统键盘正上方，不占终端显示区

            做成 `inputAccessoryView`（附件栏）而不是 App 内的面板：
            系统键盘本来就吃掉一半屏幕，再在 App 里加一块面板就只剩几行输出了。

            ```
            ┌────────────────────────────────────────┐
            │ 输入 › ls -l /etc/ho█            📋 ↑ │  ← App 区域，完全不变
            ├────────────────────────────────────────┤
            │ esc  ↑  ↓  ←  →  ⌫  ^C           │  ← 附件栏（常驻）
            ├────────────────────────────────────────┤
            │ |  >  >>  <  2>  &  ;  ~  /  -  _     │  ← 符号页，点 › 展开
            │ .  =  *  '  "  `  $  #  %  !  ?  @     │
            ├────────────────────────────────────────┤
            │ q  w  e  r  t  y  u  i  o  p            │  ← 系统键盘照旧可用
            └────────────────────────────────────────┘
            ```

            输入框左侧的 `›` 是符号页开关：点一下展开，再点收起（变黄表示已展开）。
            控制键那一行始终在。

            ### 输入框换成了 `UITextField`

            扩展键盘要做光标移动（← →）、选中替换、↑↓ 翻历史回填，
            这些**全都依赖 `selectedTextRange`，SwiftUI 的 `TextField` 不暴露它**。
            换成 UIKit 之后 `inputAccessoryView` 也顺带变成原生能力。

            **这是本项目风险最高的一次改动**：输入框是所有功能的地基，换掉之后
            中文界面、长按选择、拖动选择、复制、输入历史、补全、危险命令拦截
            全部要重新验一遍。

            ### 各键定义

            | 键 | 行为 |
            |---|---|
            | `esc` | 清空当前输入行 |
                        | `^C` | 清空输入行；若有命令在跑就 `SIGKILL` 掉它 |
            | `↑` `↓` | 翻历史命令（只回填输入框，不动光标） |
            | `←` `→` | 光标左右移动一格，有选区时先取消选区 |
            | ⌫ | 退格。先删选区，没有选区就删光标前一个 |
            | 符号键 | 在光标处插入，有选区时先替换选区 |

            ^C 杀的是 `posix_spawn` 出来的直接子进程。TT 的执行器不用 shell 管进程组
            （fork 在本机是坏的），所以只能杀最外层这一个——
            单条命令下它就是命令本身，`&&` 链里只能杀掉当前这一段。

            ### 必须逐条验的回归

            输入框被换掉了，下面每一条都要重新确认：

            ```
            1. 点输入框能弹键盘，附件栏出现在系统键盘正上方
            2. 能打字、能删字、能发送，中文界面不变
            3. ls + 空格 → 候选里 -l  -a  在前，路径在后
            4. 点 › → 符号页展开，再点收起
            5. 点 | > >> < 2> & ; ~ / - _ . = * ' " ` $ # % ! ? @ → 插入到光标处
            8. ↑ → 回填上一条历史命令，连按可以往前翻；↓ 翻回来
            9. 输入 ls -l 然后按 ← ← → 看光标能不能移动
            10. esc → 输入行清空
            11. 起一条长命令（比如 find /），^C 能立刻停掉
            12. 终端里长按选择、拖动手柄、复制菜单照常
            13. rm -rf / 仍然弹「已拦截，不会执行」，只有「知道了」
            14. rm -rf /tmp/ttd 正常执行不弹窗
            15. 手册面板、复制全部、清空、历史记录按钮都正常
            ```

            ## v0.4.20：真凶找到了 —— `optionList` 的过滤顺序反了

            ### 一行代码，连挂五版

            ```swift
            firstClause.split(separator: " ").map(String.init)
                .filter { $0.hasPrefix("-") }                          // ← 先判断
                .map { $0.trimmingCharacters(in: CharacterSet(charactersIn: "[]")) }  // ← 后去括号
            ```

            手册里几乎所有选项都写成 **`[-l]`** 这种带方括号的占位形式，
            而 `"[-l]".hasPrefix("-")` 是 **false** —— 开头是 `[` 不是 `-`。

            **于是全部 33 条命令的 `optionList` 都返回空数组，补全条永远不出选项。**
            不是渲染问题，不是解析问题，是数据源本身就是空的。

            这个错从 `optionList` 引进那天起就在，四版修复全改在了下游
            （横杠怎么补、空格怎么补、split 的歧义、卡片 id），**没有一处碰过它**。

            修法：**先剥方括号，再判断是不是选项**。

            ```swift
            firstClause.split(separator: " ")
                .map { $0.trimmingCharacters(in: CharacterSet(charactersIn: "[]")) }
                .map { $0.trimmingCharacters(in: .whitespaces) }
                .filter { $0.hasPrefix("-") && $0.count > 1 }
            ```

            注意切分仍然在去括号**之前**：`[-c 列表]` 会切成 `[-c` 和 `列表]`，
            反过来就会拼出 `-c 列表` 这种带占位符的脏 token。

            ### 现在有选项的命令（19 条）

            | 命令 | 选项 | 命令 | 选项 |
            |---|---|---|---|
            | `ls` | `-l` `-a` | `sort` | `-n` `-r` `-u` |
            | `mkdir` | `-p` | `grep` | `-i` `-v` `-n` |
            | `head` | `-n` | `wc` | `-l` `-w` `-c` |
            | `tail` | `-n` | `uniq` | `-c` |
            | `cp` | `-r` | `cut` | `-d` `-f` `-c` |
            | `rm` | `-f` | `tr` | `-d` |
            | `df` | `-h` | `du` | `-s` `-h` |
            | `uname` | `-a` | `find` | `-name` `-type` |

            另外 14 条本来就没有选项（`cat` `mv` `touch` `stat` `echo` `cd` `pwd`
            `date` `whoami` `test` `sleep` `clear` `true` `false`），候选里不该出现它们。

            ### 二、`ttdebug` 不在手册里

            它只在代码里，没进 `CommandManual.docs`，所以输入它时候选条一个都不出。
            已补进「诊断探针」分区。现在输入 `tt` 会出现
            `ttfork` / `ttprobe` / `ttdebug`。

            ### 三、新增回归脚本 `scripts/completion_selftest.ps1`

            把 `optionList` + `InputParser` + `completions(for:)` 整个逻辑
            搬成 PowerShell（本机没 Swift 编译器，但这套是纯字符串处理，搬得动），
            **33 条用例**，当前 33/33 通过。

            这次就是靠它一次抓出来的——这类"数据源算出来就是空"的错，
            在 Swift 侧无论如何读代码都看不出来，因为**读代码时你脑子里
            默认 `"[-l]"` 会被 `hasPrefix` 命中**。

            ### 验收

            ```
            1. ls + 空格      → -l  -a  + 路径，选项排在路径前面
            2. mkdir + 空格   → -p
            3. sort + 空格    → -n  -r  -u
