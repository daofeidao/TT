name: TT 编译与发布

on:
  push:
    branches: [main, "v0.3.0-*", "v0.3.1-*", "v0.3.2-*", "v0.3.4-*"]
  workflow_dispatch:

concurrency:
  group: tt-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: 编译 iOS 安装包
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: 获取项目源码
        uses: actions/checkout@v4

      - name: 检查苹果编译环境
        run: |
          xcode-select -p
          xcodebuild -version

      - name: 安装项目生成工具
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          fi
          xcodegen --version

      - name: 生成 TT 应用图标
        run: swift scripts/generate_icon.swift

      - name: 编译容器内探针程序 ttprobe
        run: |
          set -euo pipefail
          SYSROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun -sdk iphoneos clang -arch arm64 -isysroot "$SYSROOT" -O2 -o scripts/ttprobe scripts/ttprobe.c
          file scripts/ttprobe
          test -s scripts/ttprobe

      - name: 构建内置命令工具 ttbin
        run: |
          set -euo pipefail
          SYSROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          mkdir -p TT/ttbin
          for t in ls cat date whoami uname df; do
            xcrun -sdk iphoneos clang -arch arm64 -isysroot "$SYSROOT" -O2 -o "TT/ttbin/$t" "scripts/tttools/tt${t}.c"
          done
          file TT/ttbin/*

      - name: 构建内置 Shell mksh 并签名嵌套二进制
        run: bash scripts/build-mksh.sh

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 编译 iPhone 应用
        run: |
          set -euo pipefail
          xcodebuild \
            -project TT.xcodeproj \
            -scheme TT \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: 打包 IPA 安装包
        run: |
          set -euo pipefail
          APP="build/DerivedData/Build/Products/Release-iphoneos/TT.app"
          test -d "$APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist" | grep -Fx 'com.daofeidao.tt'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist" | grep -Fx '0.3.4'
          test -s "$APP/ttprobe"
          test -s "$APP/ttbin/mksh"
          for t in ls cat date whoami uname df; do test -s "$APP/ttbin/$t"; done
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/TT.app
          /usr/bin/codesign --force --deep --sign - --entitlements tt.entitlements build/ipa/Payload/TT.app
          cd build/ipa
          /usr/bin/zip -qry ../TT-v0.3.4.ipa Payload
          cd ../..
          test -s build/TT-v0.3.4.ipa
          echo "IPA 安装包已生成："
          ls -lh build/TT-v0.3.4.ipa
          /usr/bin/unzip -l build/TT-v0.3.4.ipa | head -40

      - name: 发布 v0.3.4 并上传 IPA
        if: github.ref == 'refs/heads/v0.3.4-composite-copy' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.4
          name: TT v0.3.4（组合命令执行 + 一键复制全部）
          body: |
            ## v0.3.4：组合命令执行 + 一键复制全部

            ### v0.3.3 真机验收（已通过）

            | 测试 | 结果 |
            |---|---|
            | 嵌套二进制签名（mksh） | 6 项 entitlements 完整保留 ✅ |
            | 探测② mksh / ③ ttprobe | 退出码 0，探针输出真实 uid/cwd/系统版本 ✅ |
            | `pwd` / `ls` / `date` / `echo hi` | 真实 Shell 执行，退出码 0 ✅ |
            | `ls /nonexistent` | 标准错误输出 + 退出码 1 ✅ |
            | `cd bin` → `pwd` → `ls` | `/bin` → `df` `ps`，目录保持生效 ✅ |
            | `echo abc \| wc`、`ls /etc && pwd` | Bus error（138）❌ |

            **结论**：命令已真正由 mksh 执行。唯一遗留问题：mksh 在本设备上连续 fork 两次会触发 SIGBUS（单条命令正常，组合命令崩溃）。

            ### 本版改动

            1. **组合命令执行引擎**：应用层将 `|`、`||`、`&&`、`;` 拆分为多个单命令段，逐段交由 mksh 真实执行，输出按序拼接。
               - `|` 管道：上一段 stdout 经临时文件作为下一段 stdin 传入（真实数据流）。
               - `&&` / `||`：按上一段真实退出码短路（语义与 shell 一致）。
               - 每段只 fork 一次，规避 mksh 多 fork 的 SIGBUS。
            2. **修复 `cd X && Y`**：拆分后 `cd` 由内置解释器在主进程内执行（目录状态跨命令保持），后续段由 mksh 执行并自动继承新目录。
            3. **`ls -l` 长格式**：新增权限位、大小、修改时间显示；`-a`/`-l` 可组合（`-al`、`-la`）。
            4. **一键复制全部**：工具栏新增复制按钮，点击即把整个终端文本写入剪贴板（长按选择复制功能保留不变）。
            5. 权限（RootHelper spawn 配方）与嵌套二进制签名机制保持不变。

            ### 建议测试

            `pwd` → `ls` → `ls -l` → `ls -la` → `echo abc | wc` → `ls /etc && pwd` → `ls /nonexistent || echo fallback` → `cd bin && ls` → `cd /etc; pwd` → 点工具栏复制按钮

            **验收状态：** 编译 ✅、IPA ✅、真机执行 ⏳ 待验证。
          files: build/TT-v0.3.4.ipa
          fail_on_unmatched_files: true
          make_latest: true

      - name: 上传备用编译产物
        uses: actions/upload-artifact@v4
        with:
          name: TT-v0.3.4-测试版-IPA
          path: build/TT-v0.3.4.ipa
          if-no-files-found: error
          retention-days: 14